[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
# semver2 renders a pre-release as "1.8.0-beta.0" (the "-beta.N" form the
# agent's beta release channel follows, sc-129692) and a full release exactly
# as "semver" did, so stable tags are unchanged.
version_scheme = "semver2"
version_provider = "scm"
