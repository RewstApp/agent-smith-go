name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run all tests
        run: go test ./...

      # The journal, spool and install writes fsync (sc-119835); the acceptance
      # criterion is a median under 20 ms per write on each runner. Recorded
      # here on every run rather than asserted, so the number is in the log
      # without a starved runner being able to fail the build on it.
      - name: Record the per-write fsync cost
        run: go test ./internal/utils -run TestWriteFileAtomic_MedianCost -v -count=1

      # The agent's command path is concurrent in ways a plain run cannot check:
      # a worker pool that outlives its connection cycle and overlaps the next
      # (sc-118039), the journal ownership map, the postback spool flushed on
      # one goroutine while workers write to it, the log rotator's
      # drain-before-swap. A separate step so a race report is distinguishable
      # from a test failure in the summary. Windows is excluded: -race needs cgo
      # and a C toolchain the hosted runner does not reliably provide, and the
      # Windows-only files are covered by the GOOS=windows vet and lint jobs
      # (sc-119837).
      - name: Run all tests under the race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
