name: E2E

# One run at a time, across every branch. The IT org's config endpoint hands
# every run the same fixed device_id per platform, and Azure IoT Hub permits a
# single connection per device - so two runs in flight install two agents on
# one device that kick each other off every few seconds, and a command sent
# by one run is executed and posted back by the other's agent. A second
# dispatch now waits for the first to finish instead of colliding with it.
# cancel-in-progress is off deliberately: a queued re-dispatch must not kill
# a run that is mid-suite with a real agent installed on the runner.
concurrency:
  group: e2e
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Platform to test"
        required: true
        type: choice
        options:
          - all
          - windows-latest
          - ubuntu-latest
          - macos-latest

jobs:
  # ---- Live smoke - Lifecycle: install, commands, logging, syslog, uninstall ----
  # ---- Live smoke - Auto-update: happy path against the real release endpoint ----
  # ---- Connection: reconnect after disruption, SAS renewal ----
  # ---- Live smoke - Broker withholding SUBACK: bounded subscribe, prompt stop, recovery ----
  # ---- Command timeouts: default and configured ----
  # ---- Output bounds: stdout and stderr floods ----
  # ---- Output bound and command timeout composed ----
  # ---- Live smoke, Windows-only: postback disabled ----
  # ---- Go e2e scenarios: auto-update retries and digests, startup sweeps, wedged stop, locked directory ----
  # The scenarios that need nothing but stubs the repository owns run as a Go
  # test package against the real binary (test/e2e, sc-126321): the config
  # endpoint and the release endpoint are httptest servers inside the test
  # process, the binary is installed as a real service, and every wait is a
  # bounded poll. They used to be about ninety workflow steps across the
  # live-sweeps, live-update-retry, live-auto-update and live-windows-only
  # jobs. Nothing here reaches the hub or the engine, so the job gates the
  # merge with the hermetic jobs.
  e2e-go:
    permissions:
      contents: read
    needs: [build, build-integration-test, set-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download compiled binary
        uses: ./.github/actions/download-binary
        with:
          name: ${{ matrix.os }}

      - name: Download integration test binary
        uses: ./.github/actions/download-binary
        with:
          name: it-${{ matrix.os }}

      - name: Run the Go e2e scenarios
        timeout-minutes: 25
        uses: ./.github/actions/run-e2e-package
        with:
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          run: 'TestAutoUpdate|TestSweeps|TestWedgedService|TestUninstall'
          timeout: 22m
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

  # ---- Config-fetch response size ceiling (sc-112405) ----
  # Config mode read the config endpoint's POST response with a bare
  # io.ReadAll. configHTTPTimeout (5 minutes) bounded the request in time but
  # not in bytes, so a compromised, misconfigured or DNS-hijacked endpoint - or
  # a proxy on the path to it - could answer 200 and stream an effectively
  # unbounded body straight into memory during install. The body is now read
  # through an io.LimitReader capped at maxConfigResponseSize (10 MiB); see the
  # README's "Bounded Config-Fetch Response" section.
  #
  # Its own job rather than a scenario inside `test`: both legs run config mode,
  # which writes the config file, replaces the installed binary and re-registers
  # the service - so running them on the runner `test` uses would tear down the
  # installation every one of its later scenarios depends on. A separate job
  # gets a clean machine, does its own install and uninstall, and needs no live
  # Azure IoT Hub: the endpoint under test is the config endpoint, and it is
  # stubbed.
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      os_list: "${{ inputs.os == 'all' && '[''windows-latest'',''ubuntu-latest'',''macos-latest'']' || format('[{0}{1}{0}]', '''', inputs.os) }}"
      cache: true

  build-integration-test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os == 'all' && '[''windows-latest'',''ubuntu-latest'',''macos-latest'']' || format('[{0}{1}{0}]', '''', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    # 2x the p95 of the last 20 runs (see README "Bounding the e2e jobs").
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Cache integration test build output
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ./dist
          key: build-it-${{ matrix.os }}-go1.25.0-${{ hashFiles('**/*.go', 'go.sum', 'go.mod') }}

      - name: Setup go
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true

      - name: Build integration test binary
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        id: build
        run: ./scripts/build_integration_test.ps1 | % { "binary_path=$_" } >> $env:GITHUB_OUTPUT

      - name: Upload integration test binary
        uses: actions/upload-artifact@v6
        with:
          name: it-${{ matrix.os }}
          path: ${{ steps.build.outputs.binary_path || './dist/*' }}

  set-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 2x the p95 of the last 20 runs (see README "Bounding the e2e jobs").
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      windows_matrix: ${{ steps.gen.outputs.windows_matrix }}
    steps:
      - name: Build test matrix include
        id: gen
        shell: pwsh
        env:
          OS_INPUT: ${{ inputs.os }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
        run: |


          $orgId = $env:ORG_ID

          $entries = @(
            [ordered]@{
              os = 'ubuntu-latest'
              binary = 'rewst_agent_config.linux.bin'
              it_binary = 'rewst_agent_config.linux.it.bin'
              config_dir = '/etc/rewst_remote_agent'
              log_file = "/etc/rewst_remote_agent/$orgId/rewst_agent.log"
              service = "rewst_remote_agent_$orgId"
              # Moved under the data directory (sc-108848); deterministic and
              # fixed, unlike the old $TMPDIR-based path, so it can be a
              # static matrix value rather than resolved from the log.
              scripts_dir = "/etc/rewst_remote_agent/$orgId/scripts"
              # The scenario jobs' e2e-setup install-agent call does not pass
              # --service-username (that only happens in the separate
              # test-service-user job below), so the service here runs as the
              # platform default account.
              scripts_dir_owner = 'root'
              uninstall_paths = "/etc/rewst_remote_agent/$orgId`n/usr/local/bin/rewst_remote_agent/$orgId`n/etc/rewst_remote_agent/$orgId/scripts"
              service_user = 'rewst-it-svc'
              service_username_arg = 'rewst-it-svc'
              service_identity = 'rewst-it-svc'
            },
            [ordered]@{
              os = 'windows-latest'
              binary = 'rewst_agent_config.win.exe'
              it_binary = 'rewst_agent_config.win.it.exe'
              config_dir = 'C:\ProgramData\RewstRemoteAgent'
              log_file = "C:\ProgramData\RewstRemoteAgent\$orgId\rewst_agent.log"
              service = "RewstRemoteAgent_$orgId"
              # Deliberately NOT moved (sc-108848): some customers whitelist
              # this exact path in their endpoint security software so the
              # agent's dynamically-written scripts are not flagged/blocked.
              scripts_dir = "C:\RewstRemoteAgent\scripts\$orgId"
              scripts_dir_owner = ''
              uninstall_paths = "C:\ProgramData\RewstRemoteAgent\$orgId`nC:\Program Files\RewstRemoteAgent\$orgId`nC:\RewstRemoteAgent\scripts\$orgId"
              service_user = 'rewst-it-svc'
              service_username_arg = '.\rewst-it-svc'
              service_identity = '.\rewst-it-svc'
            },
            [ordered]@{
              os = 'macos-latest'
              binary = 'rewst_agent_config.mac-os.bin'
              it_binary = 'rewst_agent_config.mac-os.it.bin'
              config_dir = '/Library/Application Support/rewst_remote_agent'
              log_file = "/Library/Application Support/rewst_remote_agent/$orgId/rewst_agent.log"
              service = "io.rewst.remote_agent_$orgId"
              # Moved under the data directory (sc-108848); deterministic and
              # fixed, unlike the old $TMPDIR-based path, so it can be a
              # static matrix value rather than resolved from the log.
              scripts_dir = "/Library/Application Support/rewst_remote_agent/$orgId/scripts"
              # The scenario jobs' e2e-setup install-agent call does not pass
              # --service-username (that only happens in the separate
              # test-service-user job below), so the service here runs as the
              # platform default account.
              scripts_dir_owner = 'root'
              uninstall_paths = "/Library/Application Support/rewst_remote_agent/$orgId`n/usr/local/bin/rewst_remote_agent/$orgId`n/Library/Application Support/rewst_remote_agent/$orgId/scripts"
              service_user = 'rewst-it-svc'
              service_username_arg = 'rewst-it-svc'
              service_identity = 'rewst-it-svc'
            }
          )

          if ($env:OS_INPUT -ne 'all') {
            $entries = @($entries | Where-Object { $_.os -eq $env:OS_INPUT })
          }

          $payload = @{ include = $entries }
          $json = ConvertTo-Json -InputObject $payload -Depth 10 -Compress
          Write-Output $json
          "matrix=$json" >> $env:GITHUB_OUTPUT
          # The Windows-only scenario job takes just the windows-latest entry (an
          # empty include when it is not in the dispatch; the job's if skips it).
          $winEntries = @($entries | Where-Object { $_.os -eq 'windows-latest' })
          $winJson = ConvertTo-Json -InputObject @{ include = $winEntries } -Depth 10 -Compress
          "windows_matrix=$winJson" >> $env:GITHUB_OUTPUT

  live-lifecycle:
    permissions:
      contents: read
    # Live smoke (sc-126320): installs from the Rewst config endpoint and talks
    # to the real hub and engine, so it can go red for reasons that are not
    # the agent (the hub's daily quota, an expired integration token, the
    # engine's ceiling). It no longer gates the merge - the hermetic jobs do -
    # and reports its outcome in the job summary instead.
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      - name: Check subscribed messages log for topic and QoS
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          patterns: Subscribed to messages
          subscribed_topic_qos: "true"

      - name: Send success command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for successful command
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      # ---- Scripts directory permissions (sc-108848) ----
      # The scripts directory is created on demand the first time a command
      # runs, so this must come after the success command above. On
      # Linux/macOS it asserts the EnsureSecureDir hardening (mode 0700, owned
      # by the service account) that replaced the old shared-temp directory;
      # on Windows, where the directory deliberately did not move, it only
      # confirms the historical path still exists (see the action's
      # description for why).

      - name: Assert scripts directory has hardened permissions
        timeout-minutes: 5
        uses: ./.github/actions/assert-scripts-dir-permissions
        with:
          scripts_dir: ${{ matrix.scripts_dir }}
          expected_owner: ${{ matrix.scripts_dir_owner }}

      - name: Send failing command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: failure

      - name: Check logs for error handling
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          patterns: Command failed

      - name: Update logging level to debug
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --logging-level debug --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Send test command (debug)
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for debug level
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          patterns: DEBUG

      - name: Stop service
        timeout-minutes: 5
        uses: ./.github/actions/stop-service
        with:
          service: ${{ matrix.service }}

      - name: Delete log file
        timeout-minutes: 5
        uses: ./.github/actions/delete-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Update agent (no auto updates)
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Check logs for no auto updater
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-missing
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Starting auto updater
          wait_for_file_seconds: "30"

      # --disable-agent-postback only has an effect on Windows: the PowerShell
      # executor's AlwaysPostback() is false there because the typed PowerShell
      # the engine wraps commands in posts its own result, so the agent's
      # duplicate postback is what "Postback already sent" records. On Linux
      # and macOS the executor always posts back and the flag is ignored. This
      # is the one scenario that verifies the flag, so it is passed here,
      # explicitly, and nowhere else (sc-117885: it used to ride along in a
      # Windows-only matrix value that seven unrelated update steps inherited).
      # The syslog update below runs without it, which re-enables the agent
      # postback - every --update resets the option from its own flags.

      - name: Update agent with syslog
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --syslog --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Send test command (syslog)
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check syslog for command completed
        timeout-minutes: 5
        uses: ./.github/actions/assert-syslog-contains
        with:
          service: ${{ matrix.service }}
          pattern: Command completed

      - name: Uninstall agent
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --uninstall --org-id ${{ vars.IT_ORG_ID }}

      # Runs on every platform: on Windows this is the state left by the locked
      # scenario plus the by-hand removal of the one directory it named, which
      # is the operator's path back to a clean endpoint.

      - name: Check deleted directories
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Record the live smoke outcome
        if: always()
        uses: ./.github/actions/smoke-summary
        with:
          job: live-lifecycle
          outcome: ${{ job.status }}


  live-auto-update:
    permissions:
      contents: read
    # Live smoke (sc-126320): installs from the Rewst config endpoint and talks
    # to the real hub and engine, so it can go red for reasons that are not
    # the agent (the hub's daily quota, an expired integration token, the
    # engine's ceiling). It no longer gates the merge - the hermetic jobs do -
    # and reports its outcome in the job summary instead.
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, live-lifecycle]
    # Chained behind the previous scenario job, not parallel to it: the live
    # config endpoint gives every install on a platform the same device id, so
    # two scenario agents at once kick each other off IoT Hub and commands land
    # on whichever holds the connection. Parallelism returns with the hermetic
    # migration (sc-126319), where each job has its own device identity. The
    # chain never skips a scenario because an earlier one failed: each starts
    # from a fresh install and reports on its own.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      # Baseline before the event so the wait below needs a *new* line (sc-117884).

      - name: Baseline "Updating agent" before the auto-updating install
        id: bl_updating_agent
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Updating agent"

      - name: Install integration test binary (old version)
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.it_binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --github-token ${{ secrets.GITHUB_TOKEN }}

      # Captured before the real auto-update fires, so the assertions below
      # measure what that update did rather than the restart the IT binary
      # install above already caused.

      - name: Capture pre-auto-update baseline counts
        id: autoupdate_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-pre-auto-update-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Wait for auto updater to trigger and update
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Updating agent
          baseline_count: ${{ steps.bl_updating_agent.outputs.count }}

      - name: Verify auto update completed
        timeout-minutes: 5
        uses: ./.github/actions/verify-auto-update
        with:
          log_file: ${{ matrix.log_file }}

      # ---- Linux systemd cgroup-kill regression (sc-109762) ----
      # verify-auto-update above only checks the log for "Updating agent" and
      # that the last "Agent Smith started" line isn't the IT version - but
      # that line is logged by the --update helper on its own startup, before
      # it ever stops the old service, so it already names the new version
      # even when the helper is killed moments later and never restarts
      # anything. On Linux, the helper used to inherit the running service's
      # systemd cgroup, so calling `systemctl stop` on its own unit triggered
      # KillMode=control-group and killed the helper along with the service it
      # asked to stop - the endpoint was left offline with the old binary
      # still in place and no automatic recovery. The real proof the update
      # finished is the helper's own "Service started" line, logged only after
      # it replaced the binary and called svc.Start() - the exact point the
      # cgroup kill used to cut it off. Counts are compared as deltas because
      # "Service started" also appears once from installing the IT binary
      # above, and "Subscribed to messages" already has lines from earlier
      # scenarios.

      - name: Assert the update helper survived to restart the service
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-update-helper-survived-to-restart-the-service
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.autoupdate_baseline.outputs.started }}

      - name: Check service is active after auto-update
        timeout-minutes: 5
        uses: ./.github/actions/check-service
        with:
          service: ${{ matrix.service }}

      - name: Wait for fresh subscription after auto-update
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-fresh-subscription-after-auto-update
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.autoupdate_baseline.outputs.subscribed }}

      - name: Send command after auto-update
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for command completion after auto-update
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success


      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Record the live smoke outcome
        if: always()
        uses: ./.github/actions/smoke-summary
        with:
          job: live-auto-update
          outcome: ${{ job.status }}


  live-wedged-broker:
    permissions:
      contents: read
    # Live smoke (sc-126320): installs from the Rewst config endpoint and talks
    # to the real hub and engine, so it can go red for reasons that are not
    # the agent (the hub's daily quota, an expired integration token, the
    # engine's ceiling). It no longer gates the merge - the hermetic jobs do -
    # and reports its outcome in the job summary instead.
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, live-auto-update]
    # Chained behind the previous scenario job, not parallel to it: the live
    # config endpoint gives every install on a platform the same device id, so
    # two scenario agents at once kick each other off IoT Hub and commands land
    # on whichever holds the connection. Parallelism returns with the hermetic
    # migration (sc-126319), where each job has its own device identity. The
    # chain never skips a scenario because an earlier one failed: each starts
    # from a fresh install and reports on its own.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      - name: Send success command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for successful command
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      # ---- Withheld-SUBACK scenario (sc-106107) ----
      # The reconnection scenario above severs the connection, which keepalive
      # detects and the agent handles as an ordinary reconnect. This one covers
      # the harder case it cannot reach: a broker that stays alive - completing
      # the TLS handshake, answering CONNECT with CONNACK, and answering every
      # PINGREQ - while never sending SUBACK. That is what Azure IoT Hub does when
      # it throttles a device, and what a middlebox that half-opens a connection
      # produces. Before the fix it left the agent connected but never subscribed,
      # silently running no commands and unable to honor a stop; now the subscribe
      # wait is bounded and stop-interruptible, so the agent fails cleanly, backs
      # off, and recovers on a later cycle once the broker starts acknowledging.
      # Counts are compared as deltas because the log already carries lines from
      # earlier cycles.

      - name: Capture SUBACK-withheld baseline counts
        id: suback_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-suback-withheld-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Resolve the scripts directory (SUBACK scenario)
        id: suback_scripts_dir
        uses: ./.github/actions/it-script
        with:
          script: resolve-the-scripts-directory-suback-scenario
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Snapshot temp script files before the withheld-SUBACK scenario
        timeout-minutes: 5
        uses: ./.github/actions/assert-no-orphaned-scripts
        with:
          mode: snapshot
          scripts_dir: ${{ steps.suback_scripts_dir.outputs.path }}

      - name: Start stub broker withholding SUBACK
        timeout-minutes: 15
        id: stub_broker
        uses: ./.github/actions/stub-broker
        with:
          mode: start

      - name: Point agent at the stub broker
        timeout-minutes: 5
        id: stub_host
        uses: ./.github/actions/set-broker-host
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          host: ${{ steps.stub_broker.outputs.host }}

      # --update restarts the service, so the rewritten broker host takes effect.
      # The short subscribe timeout keeps each wedged cycle to ~10s so several
      # backoff slots are observable inside the job.

      - name: Restart agent against the stub broker
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --mqtt-subscribe-timeout-seconds 10 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Assert bounded subscribe failure and growing backoff
        timeout-minutes: 6
        id: assert_suback_withheld
        uses: ./.github/actions/it-script
        with:
          script: assert-bounded-subscribe-failure-and-growing-backoff
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASE_TIMED_OUT: ${{ steps.suback_baseline.outputs.timed_out }}
          BASE_BACKOFFS: ${{ steps.suback_baseline.outputs.backoffs }}
          BASE_SUBSCRIBED: ${{ steps.suback_baseline.outputs.subscribed }}

      - name: Dump agent log on withheld-SUBACK failure
        if: failure() && steps.assert_suback_withheld.outcome == 'failure'
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Assert the service stops promptly while wedged on the stub broker
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-service-stops-promptly-while-wedged-on-the-stub-broker
        env:
          LOG_FILE: ${{ matrix.log_file }}
          SERVICE: ${{ matrix.service }}

      - name: Assert no orphaned scripts after the wedged stop
        timeout-minutes: 5
        uses: ./.github/actions/assert-no-orphaned-scripts
        with:
          mode: assert
          scripts_dir: ${{ steps.suback_scripts_dir.outputs.path }}

      # Baseline before the event so the wait below needs a *new* line (sc-117884).

      - name: Baseline the subscribe-timeout line before the restart against the withholding broker
        id: bl_wedge_again
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Failed to subscribe: timed out waiting for broker acknowledgement"

      - name: Restart the service against the still-withholding broker
        timeout-minutes: 5
        uses: ./.github/actions/start-service
        with:
          service: ${{ matrix.service }}

      - name: Wait for the agent to wedge on the stub broker again
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Failed to subscribe: timed out waiting for broker acknowledgement"
          baseline_count: ${{ steps.bl_wedge_again.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      # Flipped on the live connection - the stub re-reads its mode per packet -
      # so recovery is the agent's own next reconnect cycle, not a restart.

      - name: Switch stub broker to acknowledge SUBACK
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: ack

      - name: Assert the agent recovers on a later cycle
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-agent-recovers-on-a-later-cycle
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.suback_baseline.outputs.subscribed }}

      - name: Restore the real broker host
        timeout-minutes: 5
        if: always() && steps.stub_host.outputs.previous_host != ''
        uses: ./.github/actions/set-broker-host
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          host: ${{ steps.stub_host.outputs.previous_host }}

      - name: Stop stub broker
        timeout-minutes: 15
        if: always()
        uses: ./.github/actions/stub-broker
        with:
          mode: stop

      # Baseline first so the wait below is satisfied only by *this* restart's
      # subscription. A bare match passed instantly on a line left by an earlier
      # cycle, and the default-timeout scenario that follows then captured its
      # own baseline before this restart had actually subscribed.

      - name: Capture subscription baseline before restarting against the real broker
        if: always() && steps.stub_host.outputs.previous_host != ''
        id: real_broker_sub_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-restore-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Restart agent against the real broker
        timeout-minutes: 10
        if: always() && steps.stub_host.outputs.previous_host != ''
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --mqtt-subscribe-timeout-seconds 30 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for resubscription to the real broker
        timeout-minutes: 6
        if: always() && steps.stub_host.outputs.previous_host != ''
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.real_broker_sub_baseline.outputs.subscribed }}
          max_attempts: "60"
          interval_seconds: "2"

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Record the live smoke outcome
        if: always()
        uses: ./.github/actions/smoke-summary
        with:
          job: live-wedged-broker
          outcome: ${{ job.status }}


  live-windows-only:
    permissions:
      contents: read
    # Live smoke (sc-126320): installs from the Rewst config endpoint and talks
    # to the real hub and engine, so it can go red for reasons that are not
    # the agent (the hub's daily quota, an expired integration token, the
    # engine's ceiling). It no longer gates the merge - the hermetic jobs do -
    # and reports its outcome in the job summary instead.
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, live-wedged-broker]
    # Chained behind the previous scenario job, not parallel to it: the live
    # config endpoint gives every install on a platform the same device id, so
    # two scenario agents at once kick each other off IoT Hub and commands land
    # on whichever holds the connection. Parallelism returns with the hermetic
    # migration (sc-126319), where each job has its own device identity. The
    # chain never skips a scenario because an earlier one failed: each starts
    # from a fresh install and reports on its own.
    # The scenarios here are Windows-only (job object, SCM StopPending, sharing
    # violations); the job is skipped outright when windows-latest is not in the
    # dispatch rather than installing an agent on the other platforms to skip
    # every step.
    if: ${{ !cancelled() && contains(fromJson(needs.set-matrix.outputs.matrix).include.*.os, 'windows-latest') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.windows_matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      - name: Send success command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for successful command
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      # ---- Wedged Windows service stop scenario (sc-106108) ----
      # windowsService.Stop() polled the service state every 250ms in an
      # unbounded loop, so a service that never reached Stopped hung its caller
      # forever - and every caller is blocking: the unattended auto-updater, the
      # installer, and uninstall. The symptom was a device that went offline
      # during a routine update with no error logged anywhere.
      #
      # The wedge is produced by pointing the agent's own service registration at
      # the test/wedgedservice fixture, which accepts the stop control, reports
      # StopPending, and never stops (see the action for why killing or
      # suspending the agent will not do). The installed agent executable and
      # config file are left alone, so they can be hashed before and after to
      # prove an aborted update did not touch them.
      #
      # Windows only: the Unix service implementations have no such polling loop.

      - name: Update agent with the agent postback disabled
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --disable-agent-postback --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Send test command (postback verification)
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for command received
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          patterns: Command completed

      - name: Check logs absent postback
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-missing
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Postback already sent

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Record the live smoke outcome
        if: always()
        uses: ./.github/actions/smoke-summary
        with:
          job: live-windows-only
          outcome: ${{ job.status }}


  # ---- Hermetic: command timeouts (default and configured) ----
  hermetic-command-timeouts:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    # Hermetic: own device id, no Rewst or Azure, so it runs in parallel with
    # every other job and gates the merge from day one (the kill-and-replay
    # job keeps its soak-period continue-on-error separately).
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first runs (README "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Stub broker, stand-in engine and stub config endpoint on the runner, then
      # an install from them under this job's own device id (sc-126319).
      - name: Set up the hermetic scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/hermetic-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          device_id: hermetic-${{ github.run_id }}-${{ matrix.os }}-command-timeouts
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}

      - name: Capture subscription baseline before the default-timeout install
        id: default_timeout_sub_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-restore-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Install IT binary to exercise the default command timeout
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.it_binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for fresh subscription after default-timeout binary install
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          max_attempts: "60"
          interval_seconds: "2"
          baseline_count: ${{ steps.default_timeout_sub_baseline.outputs.subscribed }}

      - name: Capture default-command-timeout baseline counts
        id: default_timeout_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-command-timeout-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Send hanging command with no command_timeout_seconds configured
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: timeout

      - name: Assert hanging command was killed by the default timeout
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-hanging-command-was-killed-by-the-timeout
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.default_timeout_baseline.outputs.timed_out }}

      - name: Send command after default timeout
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert worker pool recovered after default timeout
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-worker-pool-recovered-after-timeout
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.default_timeout_baseline.outputs.completed }}

      - name: Baseline "Subscribed to messages" before the short-timeout update
        id: bl_sub_timeout_update
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Subscribed to messages"

      - name: Enable short command timeout
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --command-timeout-seconds 5 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for fresh subscription after timeout update
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.bl_sub_timeout_update.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      - name: Capture command-timeout baseline counts
        id: timeout_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-command-timeout-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Send hanging command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: timeout

      - name: Assert hanging command was killed by the timeout
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-hanging-command-was-killed-by-the-timeout
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.timeout_baseline.outputs.timed_out }}

      - name: Send command after timeout
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert worker pool recovered after timeout
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-worker-pool-recovered-after-timeout
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.timeout_baseline.outputs.completed }}

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Stop stub config endpoint
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-config
        with:
          mode: stop

      - name: Stop stub broker and engine
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-broker
        with:
          mode: stop


  # ---- Hermetic: stdout and stderr floods bounded ----
  hermetic-output-bounds:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    # Hermetic: own device id, no Rewst or Azure, so it runs in parallel with
    # every other job and gates the merge from day one (the kill-and-replay
    # job keeps its soak-period continue-on-error separately).
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first runs (README "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Stub broker, stand-in engine and stub config endpoint on the runner, then
      # an install from them under this job's own device id (sc-126319).
      - name: Set up the hermetic scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/hermetic-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          device_id: hermetic-${{ github.run_id }}-${{ matrix.os }}-output-bounds
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}

      - name: Send success command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for successful command
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      # ---- Bounded command output scenario (sc-106105) ----
      # A command's stdout and stderr used to be buffered whole in memory, so the
      # agent's heap tracked however much a script decided to write and a verbose
      # one could OOM-kill the service. Configure a deliberately small ceiling,
      # flood it by three orders of magnitude, and assert the two properties that
      # matter: the agent's RSS stays near the ceiling instead of near the output
      # size, and the discarded output is reported rather than silently dropped.
      #
      # The release binary is installed first with the per-command timeout raised
      # well past the floods' runtime, because the earlier timeout scenario left a
      # 5s deadline in the config that would kill these commands mid-write, and
      # the SAS scenario left the IT binary running with a 90s token lifetime
      # whose reconnect would cancel them. --logging-level is deliberately not
      # passed: it resets to the default (Info), which keeps the Warn under test
      # visible while leaving the debug handler that dumps whole command outputs
      # into the log switched off. --disable-agent-postback is likewise not
      # passed, so the truncated result actually traverses the postback path
      # on every platform.
      #
      # Coverage note: these steps assert on the agent log, which is where the
      # byte counts are observable on the endpoint. The same counts are what the
      # postback carries as truncated/output_bytes_produced/output_bytes_kept -
      # both come from one value computed once per command - but the postback body
      # is never logged, so confirming the workflow's received payload stays a
      # Rewst-side QA step.

      - name: Resolve the scripts directory
        id: scripts_dir
        uses: ./.github/actions/it-script
        with:
          script: resolve-the-scripts-directory
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Snapshot temp script files before the output floods
        timeout-minutes: 5
        uses: ./.github/actions/assert-no-orphaned-scripts
        with:
          mode: snapshot
          scripts_dir: ${{ steps.scripts_dir.outputs.path }}

      # Captured before the update below restarts the service: the restart's own
      # "Subscribed to messages" line must land after this snapshot for the delta
      # wait to mean anything.

      - name: Capture bounded-output baseline counts
        id: output_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-bounded-output-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Configure a small output ceiling
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --max-output-bytes 262144 --command-timeout-seconds 600 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Assert a non-positive output ceiling is rejected
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
        run: |
          # The bound must not be disablable by configuration: a non-positive
          # value is refused outright rather than accepted as "no limit" (a
          # hand-edited config falls back to the documented default instead).
          foreach ($value in @('0', '-1')) {
            if ($IsWindows) {
              $out = & "./dist/$env:BINARY" --update --org-id $env:ORG_ID --max-output-bytes $value 2>&1 | Out-String
            } else {
              $out = & sudo "./dist/$env:BINARY" --update --org-id $env:ORG_ID --max-output-bytes $value 2>&1 | Out-String
            }
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              Write-Output $out
              Write-Error "--max-output-bytes $value was accepted (exit 0); the bound must not be disablable"
              exit 1
            }
            if ($out -notmatch 'invalid max-output-bytes: must be a positive integer') {
              Write-Output $out
              Write-Error "--max-output-bytes $value was rejected without the expected validation message"
              exit 1
            }
            Write-Output "OK: --max-output-bytes $value rejected (exit $code) with the expected message"
          }
          # Explicit success: the runner appends "exit $LASTEXITCODE" to pwsh
          # steps, and the last thing this step ran was a deliberately failing
          # agent invocation, so falling off the end would report that failure as
          # the step's own.
          exit 0

      - name: Wait for fresh subscription after the output ceiling update
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-fresh-subscription-after-the-output-ceiling-update
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.output_baseline.outputs.subscribed }}

      - name: Send stdout flood command
        id: send_stdout_flood
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: verbose

      - name: Assert the stdout flood was bounded
        timeout-minutes: 5
        uses: ./.github/actions/assert-output-bounded
        with:
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}
          baseline_truncations: ${{ steps.output_baseline.outputs.truncated }}
          # A retried send may have run the command twice (run 37633504250: the
          # engine answered a transient 404 after dispatching, and the retry
          # produced a second truncation warning two seconds after the first).
          dispatches: ${{ steps.send_stdout_flood.outputs.attempts }}
          expected_ceiling_bytes: "262144"
          # At least the whole ceiling, since stdout alone floods it. The upper
          # bound carries 4 KiB of headroom rather than being exact because the
          # shell contributes a preamble of its own that is not this scenario's to
          # control - on Windows the run deliberately injects a
          # PROFILE_NOISE_<guid> marker into the all-users PowerShell profile,
          # which every agent-spawned PowerShell echoes. What the bound has to
          # catch is a stream that was not capped at all, and that would land
          # near the 200 MiB produced, not a few bytes over.
          min_kept_bytes: "262144"
          max_kept_bytes: "266240"
          min_produced_bytes: "209715200"
          max_rss_mb: "250"

      - name: Assert the flooding command still succeeded
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-flooding-command-still-succeeded
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.output_baseline.outputs.completed }}

      - name: Capture small-output baseline counts
        id: small_output_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-small-output-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Send ordinary command after the flood
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert output below the ceiling is untouched and the worker recovered
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-output-below-the-ceiling-is-untouched-and-the-worker-recovered
        env:
          LOG_FILE: ${{ matrix.log_file }}
          COMPLETED_BASELINE: ${{ steps.small_output_baseline.outputs.completed }}
          TRUNCATED_BASELINE: ${{ steps.small_output_baseline.outputs.truncated }}

      - name: Capture stderr-flood baseline counts
        id: stderr_flood_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-stderr-flood-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Send stderr flood command
        id: send_stderr_flood
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: verbose_stderr

      - name: Assert stderr is bounded independently of stdout
        timeout-minutes: 5
        uses: ./.github/actions/assert-output-bounded
        with:
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}
          baseline_truncations: ${{ steps.stderr_flood_baseline.outputs.truncated }}
          dispatches: ${{ steps.send_stderr_flood.outputs.attempts }}
          expected_ceiling_bytes: "262144"
          # Above the ceiling on purpose: the script floods stderr to its full
          # ceiling AND writes a short stdout line, so the kept total can only
          # exceed the ceiling if the two streams have separate budgets. A shared
          # budget would cap the total at 262144 and starve one of them. The upper
          # bound has the same 4 KiB of headroom as the stdout flood, for the same
          # reason: the stdout side carries the shell's preamble as well as the
          # scenario's own line.
          min_kept_bytes: "262145"
          max_kept_bytes: "266240"
          min_produced_bytes: "209715200"
          max_rss_mb: "250"

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Stop stub config endpoint
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-config
        with:
          mode: stop

      - name: Stop stub broker and engine
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-broker
        with:
          mode: stop


  # ---- Hermetic: output bound and command timeout composed ----
  hermetic-timeout-composition:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    # Hermetic: own device id, no Rewst or Azure, so it runs in parallel with
    # every other job and gates the merge from day one (the kill-and-replay
    # job keeps its soak-period continue-on-error separately).
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first runs (README "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Stub broker, stand-in engine and stub config endpoint on the runner, then
      # an install from them under this job's own device id (sc-126319).
      - name: Set up the hermetic scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/hermetic-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          device_id: hermetic-${{ github.run_id }}-${{ matrix.os }}-timeout-composition
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}

      - name: Send success command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for successful command
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      # ---- Bounded command output scenario (sc-106105) ----
      # A command's stdout and stderr used to be buffered whole in memory, so the
      # agent's heap tracked however much a script decided to write and a verbose
      # one could OOM-kill the service. Configure a deliberately small ceiling,
      # flood it by three orders of magnitude, and assert the two properties that
      # matter: the agent's RSS stays near the ceiling instead of near the output
      # size, and the discarded output is reported rather than silently dropped.
      #
      # The release binary is installed first with the per-command timeout raised
      # well past the floods' runtime, because the earlier timeout scenario left a
      # 5s deadline in the config that would kill these commands mid-write, and
      # the SAS scenario left the IT binary running with a 90s token lifetime
      # whose reconnect would cancel them. --logging-level is deliberately not
      # passed: it resets to the default (Info), which keeps the Warn under test
      # visible while leaving the debug handler that dumps whole command outputs
      # into the log switched off. --disable-agent-postback is likewise not
      # passed, so the truncated result actually traverses the postback path
      # on every platform.
      #
      # Coverage note: these steps assert on the agent log, which is where the
      # byte counts are observable on the endpoint. The same counts are what the
      # postback carries as truncated/output_bytes_produced/output_bytes_kept -
      # both come from one value computed once per command - but the postback body
      # is never logged, so confirming the workflow's received payload stays a
      # Rewst-side QA step.

      - name: Resolve the scripts directory
        id: scripts_dir
        uses: ./.github/actions/it-script
        with:
          script: resolve-the-scripts-directory
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Snapshot temp script files before the output floods
        timeout-minutes: 5
        uses: ./.github/actions/assert-no-orphaned-scripts
        with:
          mode: snapshot
          scripts_dir: ${{ steps.scripts_dir.outputs.path }}

      # Captured before the update below restarts the service, for the same
      # reason as the bounded-output baseline.

      - name: Capture timeout-composition baseline counts
        id: compose_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-timeout-composition-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Shorten the command timeout for the composition check
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --max-output-bytes 262144 --command-timeout-seconds 30 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for fresh subscription after the timeout update
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-fresh-subscription-after-the-timeout-update
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.compose_baseline.outputs.subscribed }}

      - name: Send verbose command that then hangs
        id: send_verbose_hang
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: verbose_hang

      - name: Assert the hanging command's output was still bounded
        timeout-minutes: 5
        uses: ./.github/actions/assert-output-bounded
        with:
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}
          baseline_truncations: ${{ steps.compose_baseline.outputs.truncated }}
          dispatches: ${{ steps.send_verbose_hang.outputs.attempts }}
          expected_ceiling_bytes: "262144"
          # Same headroom as the other floods: stdout fills the ceiling on its
          # own, and anything the shell adds on either stream is incidental.
          min_kept_bytes: "262144"
          max_kept_bytes: "266240"
          # Lower than the flood's full 200 MiB: the command is killed at its
          # deadline, so only the volume written before the kill is counted.
          min_produced_bytes: "104857600"
          max_rss_mb: "250"
          # The warning lands once the deadline kills the process group, and
          # cmd.WaitDelay can hold Run for up to 10s more after that.
          max_attempts: "120"

      - name: Assert the hanging command also timed out and released its worker
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-hanging-command-also-timed-out-and-released-its-worker
        env:
          LOG_FILE: ${{ matrix.log_file }}
          TIMED_OUT_BASELINE: ${{ steps.compose_baseline.outputs.timed_out }}

      - name: Send command after the verbose timeout
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert the worker recovered after the verbose timeout
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-worker-recovered-after-the-verbose-timeout
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.compose_baseline.outputs.completed }}

      - name: Assert the output floods left no orphaned script files
        timeout-minutes: 5
        uses: ./.github/actions/assert-no-orphaned-scripts
        with:
          mode: assert
          scripts_dir: ${{ steps.scripts_dir.outputs.path }}

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Stop stub config endpoint
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-config
        with:
          mode: stop

      - name: Stop stub broker and engine
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-broker
        with:
          mode: stop


  # ---- Hermetic: reconnect after the broker drops the device, SAS renewal ----
  hermetic-connection:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    # Hermetic: own device id, no Rewst or Azure, so it runs in parallel with
    # every other job and gates the merge from day one (the kill-and-replay
    # job keeps its soak-period continue-on-error separately).
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first runs (README "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Stub broker, stand-in engine and stub config endpoint on the runner, then
      # an install from them under this job's own device id (sc-126319).
      - name: Set up the hermetic scenario
        timeout-minutes: 20
