        with:
          service: ${{ matrix.service }}

      - name: Wait for the service manager to respawn the agent before ageing
        timeout-minutes: 6
        uses: ./.github/actions/await-service-respawn
        with:
          log_file: ${{ matrix.log_file }}
          baseline_count: ${{ steps.sweep_kill_sub_baseline.outputs.subscribed }}

      - name: Age the stranded script file and seed sweep control files
        timeout-minutes: 5
        uses: ./.github/actions/script-sweep-fixture
        with:
          mode: seed
          scripts_dir: ${{ steps.inflight_script.outputs.scripts_dir }}
          orphan_path: ${{ steps.inflight_script.outputs.path }}

      - name: Capture sweep log baseline count
        id: sweep_log_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-sweep-log-baseline-count
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Restart agent to trigger the startup sweep
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for and assert the startup sweep was logged
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-and-assert-the-startup-sweep-was-logged
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.sweep_log_baseline.outputs.swept }}

      - name: Assert stale script files swept and live files untouched
        timeout-minutes: 5
        uses: ./.github/actions/script-sweep-fixture
        with:
          mode: assert
          scripts_dir: ${{ steps.inflight_script.outputs.scripts_dir }}
          orphan_path: ${{ steps.inflight_script.outputs.path }}

      # ---- Downloaded installer sweep scenario (sc-106111) ----
      # Every auto-update downloads a full agent binary and executes it as the
      # installer. The installer is spawned detached and the process that could
      # delete it afterwards is the one the installer replaces, so the download
      # path cannot clean up after itself and nothing else used to - one
      # orphaned binary accumulated per update for the lifetime of the install,
      # until the volume filled and took future updates and command execution
      # with it. Verify the startup sweep now reclaims them.
      #
      # The fixture is planted rather than produced by a real update cycle: the
      # sweep is what this ticket changed, and the download side (where the file
      # lands, under what name) is covered by unit tests that assert the two
      # halves share one pattern constant. Ageing is the only simulated part, so
      # the production 24h threshold stays in play with no test-only override.
      #
      # Only the org's own updates directory is asserted here. The sweep also
      # covers the legacy shared temp directory that older agents downloaded
      # into, but that is the *service account's* temp directory - notably root's
      # private TMPDIR on macOS, not the runner's - so a fixture planted from
      # the runner would land somewhere the service never reads. That half is
      # covered by TestExecute_SweepsStaleInstallerFilesOnStartup, which runs
      # Execute in-process and can see its own temp directory.

      - name: Seed the installer sweep fixture
        timeout-minutes: 5
        uses: ./.github/actions/installer-sweep-fixture
        with:
          mode: seed
          updates_dir: ${{ matrix.config_dir }}/${{ vars.IT_ORG_ID }}/updates

      - name: Capture installer sweep log baseline count
        id: installer_sweep_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-installer-sweep-log-baseline-count
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Restart agent to trigger the installer sweep
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for and assert the installer sweep was logged
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-and-assert-the-installer-sweep-was-logged
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.installer_sweep_baseline.outputs.swept }}

      - name: Assert stale installers swept and live files untouched
        timeout-minutes: 5
        uses: ./.github/actions/installer-sweep-fixture
        with:
          mode: assert
          updates_dir: ${{ matrix.config_dir }}/${{ vars.IT_ORG_ID }}/updates

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

  update-retry:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, sweeps]
    # Chained behind the previous scenario job, not parallel to it: the live
    # config endpoint gives every install on a platform the same device id, so
    # two scenario agents at once kick each other off IoT Hub and commands land
    # on whichever holds the connection. Parallelism returns with the hermetic
    # migration (sc-126319), where each job has its own device identity. The
    # chain never skips a scenario because an earlier one failed: each starts
    # from a fresh install and reports on its own.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      # ---- Capped and jittered auto-update retry scenario (sc-106110) ----
      # The auto-update retry delay was base * (1 << attempt) with no ceiling and
      # no jitter. Unjittered, every agent that failed against the release
      # endpoint at the same moment retried at the same instants, so an outage or
      # rate limit was sustained by the fleet trying to recover from it; uncapped,
      # a large retry count overflowed the shift into a negative duration, which
      # made the wait return immediately and spun the loop against the endpoint.
      #
      # A GitHub outage is not something CI can arrange and an unroutable address
      # produces connection errors rather than the HTTP failure the ticket
      # describes, so the agent is pointed at the test/stubrelease fixture through
      # the override file the integration build honors. The fixture fails every
      # request until it is flipped, which puts the agent into retryWithBackoff
      # with the shortened build knobs - base 2s, 6 retries, 30s check interval,
      # so the cap is a quarter of that interval (7.5s) - and makes a full
      # schedule observable in under a minute.
      #
      # Fleet-wide de-synchronization needs many agents and is covered by unit
      # tests over the schedule itself. What one endpoint can show, and what these
      # steps assert, is that every slot is strictly positive, bounded by the cap,
      # varies rather than repeating, and is never served back to back.

      - name: Start stub release endpoint (failing)
        timeout-minutes: 15
        id: stub_release
        uses: ./.github/actions/stub-release
        with:
          mode: start

      - name: Capture auto-update retry baseline counts
        id: retry_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-auto-update-retry-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Point the agent at the stub release endpoint
        timeout-minutes: 5
        uses: ./.github/actions/set-release-url
        with:
          mode: set
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          url: ${{ steps.stub_release.outputs.url }}

      - name: Install integration test binary with auto-updates on
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.it_binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the update retry schedule to run
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-the-update-retry-schedule-to-run
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.retry_baseline.outputs.retrying }}

      - name: Serve a valid release payload mid-sequence
        timeout-minutes: 15
        uses: ./.github/actions/stub-release
        with:
          mode: ok

      - name: Assert the update succeeds on a retry
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-update-succeeds-on-a-retry
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.retry_baseline.outputs.succeeded }}

      - name: Assert the retry schedule is capped, jittered and never immediate
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-the-retry-schedule-is-capped-jittered-and-never-immediate
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.retry_baseline.outputs.retrying }}

      - name: Fail the release endpoint again for the stop check
        timeout-minutes: 15
        uses: ./.github/actions/stub-release
        with:
          mode: fail

      - name: Capture stop-during-backoff baseline counts
        id: retry_stop_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-stop-during-backoff-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Wait for a fresh backoff to be entered
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-a-fresh-backoff-to-be-entered
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.retry_stop_baseline.outputs.retrying }}

      - name: Assert a service stop during a backoff is prompt
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-a-service-stop-during-a-backoff-is-prompt
        env:
          LOG_FILE: ${{ matrix.log_file }}
          SERVICE: ${{ matrix.service }}
          BASELINE: ${{ steps.retry_stop_baseline.outputs.stopped }}

      - name: Capture restore baseline counts
        if: always()
        id: retry_restore_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-restore-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Clear the release url override
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/set-release-url
        with:
          mode: clear
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}

      - name: Stop stub release endpoint
        timeout-minutes: 15
        if: always()
        uses: ./.github/actions/stub-release
        with:
          mode: stop

      - name: Reinstall the release binary after the retry scenario
        timeout-minutes: 10
        if: always()
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for resubscription after the retry scenario
        timeout-minutes: 6
        if: always()
        uses: ./.github/actions/it-script
        with:
          script: wait-for-resubscription-after-the-retry-scenario
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.retry_restore_baseline.outputs.subscribed }}

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

  windows-only:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, update-retry]
    # Chained behind the previous scenario job, not parallel to it: the live
    # config endpoint gives every install on a platform the same device id, so
    # two scenario agents at once kick each other off IoT Hub and commands land
    # on whichever holds the connection. Parallelism returns with the hermetic
    # migration (sc-126319), where each job has its own device identity. The
    # chain never skips a scenario because an earlier one failed: each starts
    # from a fresh install and reports on its own.
    # The scenarios here are Windows-only (job object, SCM StopPending, sharing
    # violations); the job is skipped outright when windows-latest is not in the
    # dispatch rather than installing an agent on the other platforms to skip
    # every step.
    if: ${{ !cancelled() && contains(fromJson(needs.set-matrix.outputs.matrix).include.*.os, 'windows-latest') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.windows_matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      - name: Send success command
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for successful command
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      # ---- Wedged Windows service stop scenario (sc-106108) ----
      # windowsService.Stop() polled the service state every 250ms in an
      # unbounded loop, so a service that never reached Stopped hung its caller
      # forever - and every caller is blocking: the unattended auto-updater, the
      # installer, and uninstall. The symptom was a device that went offline
      # during a routine update with no error logged anywhere.
      #
      # The wedge is produced by pointing the agent's own service registration at
      # the test/wedgedservice fixture, which accepts the stop control, reports
      # StopPending, and never stops (see the action for why killing or
      # suspending the agent will not do). The installed agent executable and
      # config file are left alone, so they can be hashed before and after to
      # prove an aborted update did not touch them.
      #
      # Windows only: the Unix service implementations have no such polling loop.

      - name: Update agent with the agent postback disabled
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --disable-agent-postback --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Send test command (postback verification)
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Check logs for command received
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          patterns: Command completed

      - name: Check logs absent postback
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-missing
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Postback already sent

      - name: Baseline "Subscribed to messages" before the child-process timeout update
        id: bl_sub_child_update
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Subscribed to messages"

      - name: Enable a longer command timeout for the child-process scenario
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --command-timeout-seconds 15 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for fresh subscription after child-process-scenario timeout update
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.bl_sub_child_update.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      - name: Capture child-process-kill baseline counts
        id: child_process_kill_baseline
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/capture-command-timeout-baseline-counts.ps1"

      # send-command (the composite action used everywhere else in this file)
      # blocks until the device's postback round-trips back - confirmed by the
      # first attempt at this scenario, where that call alone took ~11-25s for
      # a 5-15s configured timeout. For every other scenario that is fine
      # because they only ever inspect the agent's log afterward, but here it
      # means the full timeout+kill cycle has already completed by the time a
      # following step could check the child's *live* process state - too
      # late to distinguish "job object correctly killed it" from "it never
      # spawned at all", which is exactly the distinction this scenario needs
      # to make. So the same curl call is sent in the background here, polled
      # for the child appearing while it (and the parent's timeout) are still
      # running, and only then waited on for its own completion.

      - name: Send command that spawns a child process and hangs, then wait for it to start
        timeout-minutes: 6
        shell: bash
        env:
          TRIGGER_URL: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          DEVICE_ID: ${{ steps.setup.outputs.device_id }}
          SCENARIO: child_process_hang
          E2E_CATALOG: ${{ github.workspace }}/.github/workflows/e2e-commands.json
        run: |
          # The command comes from the catalog like every other send; this job
          # is Windows-only, hence the windows family.
          COMMANDS="$(jq -er --arg s "$SCENARIO" '.[$s].windows' "$E2E_CATALOG")" \
            || { echo "::error::scenario $SCENARIO has no windows command in $E2E_CATALOG"; exit 1; }
          # This scenario cannot use the send-command action (it needs the call
          # backgrounded so it can inspect the child's live process state), but it
          # must not re-introduce the bug that action exists to fix: a discarded
          # response means an engine that never dispatched the command is reported
          # as success, and the assertion below fails instead. Same checks, inline.
          # Unlike the sweep scenario this one does not depend on the engine
          # timeout - it reinstalls with a 15s command timeout above, so the
          # postback round-trips long before the engine's ceiling.
          set -uo pipefail
          resp="$RUNNER_TEMP/child-scenario-response.json"
          curl --silent --show-error --location \
            --max-time 300 \
            --write-out '\n%{http_code}' \
            --form "device_id=\"$DEVICE_ID\"" \
            --form "commands=$COMMANDS" \
            "$TRIGGER_URL" > "$resp" &
          curl_pid=$!

          pwsh -NoProfile -File "$GITHUB_WORKSPACE/.github/workflows/it-scripts/wait-for-child-process-to-start.ps1"

          curl_exit=0
          wait "$curl_pid" || curl_exit=$?

          response="$(cat "$resp")"
          http_code="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          echo "Response body: ${body}"

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error title=send-command (child-process): request failed::curl exited $curl_exit; the command was not dispatched to the device"
            exit 1
          fi

          if [ "$http_code" = "408" ] || printf '%s' "$body" | grep -qF 'did not complete in a reasonable amount of time'; then
            echo "::error title=send-command (child-process): Rewst engine timed out::the engine did not dispatch the command before giving up (HTTP $http_code). Engine-side, NOT a regression in the code under test - re-dispatch rather than investigating the diff."
            exit 1
          fi

          case "$http_code" in
            2??) ;;
            *)
              echo "::error title=send-command (child-process): HTTP $http_code::the Rewst engine returned $http_code; the command was not dispatched to the device"
              exit 1
              ;;
          esac

      - name: Assert hanging parent command was killed by the timeout (child-process scenario)
        timeout-minutes: 6
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.child_process_kill_baseline.outputs.timed_out }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-hanging-command-was-killed-by-the-timeout.ps1"

      - name: Assert the child process did not survive the timeout kill
        timeout-minutes: 6
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-child-process-terminated.ps1"

      - name: Send command after child-process scenario
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert worker pool recovered after child-process scenario
        timeout-minutes: 6
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.child_process_kill_baseline.outputs.completed }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-worker-pool-recovered-after-timeout.ps1"

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Capture installed file hashes before the wedge
        id: wedge_hashes
        shell: pwsh
        env:
          ORG_ID: ${{ vars.IT_ORG_ID }}
          CONFIG_DIR: ${{ matrix.config_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:PROGRAMFILES "RewstRemoteAgent\$($env:ORG_ID)\agent_smith.win.exe"
          $config = Join-Path $env:CONFIG_DIR "$($env:ORG_ID)\config.json"
          foreach ($path in @($exe, $config)) {
            if (-not (Test-Path $path)) { throw "expected installed file is missing: $path" }
          }
          $exeHash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          $configHash = (Get-FileHash -Path $config -Algorithm SHA256).Hash
          "exe_path=$exe"         >> $env:GITHUB_OUTPUT
          "config_path=$config"   >> $env:GITHUB_OUTPUT
          "exe_hash=$exeHash"     >> $env:GITHUB_OUTPUT
          "config_hash=$configHash" >> $env:GITHUB_OUTPUT
          Write-Output "agent executable $exe sha256=$exeHash"
          Write-Output "config file $config sha256=$configHash"

      - name: Wedge the agent service in StopPending
        timeout-minutes: 15
        uses: ./.github/actions/wedged-service
        with:
          mode: wedge
          service: ${{ matrix.service }}

      - name: Assert the update aborts on a wedged stop
        shell: pwsh
        env:
          IT_BINARY: ${{ matrix.it_binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The integration binary is the invoker because its stop deadline is
          # overridden to 25s (see scripts/build_integration_test.ps1). The
          # released default is five minutes; that the constant is what governs a
          # production build is covered by unit tests rather than by keeping a
          # runner idle for five minutes here.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $out = & "./dist/$($env:IT_BINARY)" --update --org-id $env:ORG_ID `
            --github-token $env:GH_TOKEN 2>&1 | Out-String
          $sw.Stop()
          # The updater reports an aborted update through its log, not its exit
          # status, and this step's verdict comes from the log below.
          $global:LASTEXITCODE = 0
          $elapsed = [math]::Round($sw.Elapsed.TotalSeconds, 1)
          Write-Output "---- updater output after ${elapsed}s ----"
          Write-Output $out

          $failures = @()
          # Returning at all is the headline: before the fix this call never came
          # back. The floor proves it waited out its deadline rather than failing
          # fast for an unrelated reason; the ceiling is far above the 25s
          # deadline yet far below an unbounded hang.
          if ($sw.Elapsed.TotalSeconds -lt 20) {
            $failures += "update returned after ${elapsed}s, before its 25s stop deadline could elapse"
          }
          if ($sw.Elapsed.TotalSeconds -gt 180) {
            $failures += "update took ${elapsed}s, far past its 25s stop deadline"
          }
          # The log has to name the service, the deadline and the last observed
          # state, since that is the only account of why an unattended update
          # aborted.
          foreach ($needle in @(
            'Failed to stop service',
            'did not stop within',
            'last observed state StopPending',
            'Update aborted; existing installation left untouched'
          )) {
            if (-not $out.Contains($needle)) { $failures += "missing from the log: '$needle'" }
          }
          # And it must not have carried on as if the stop had succeeded.
          foreach ($absent in @(
            'Configuration successfully updated',
            'Agent installed to',
            'Service started'
          )) {
            if ($out.Contains($absent)) { $failures += "update proceeded past the failed stop: '$absent'" }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Output "FAIL: $_" }
            Write-Error "the update did not abort cleanly on a wedged stop"
            exit 1
          }
          Write-Output "Update aborted on the wedged stop after ${elapsed}s, as expected"
          exit 0

      - name: Assert the aborted update left the installation untouched
        shell: pwsh
        env:
          EXE_PATH: ${{ steps.wedge_hashes.outputs.exe_path }}
          CONFIG_PATH: ${{ steps.wedge_hashes.outputs.config_path }}
          EXE_HASH: ${{ steps.wedge_hashes.outputs.exe_hash }}
          CONFIG_HASH: ${{ steps.wedge_hashes.outputs.config_hash }}
        run: |
          # The whole point of aborting: the wedged process may still hold the
          # executable open, so a half-written binary or a rewritten config would
          # leave the endpoint unrecoverable without hands on it.
          $ErrorActionPreference = 'Stop'
          $failures = @()
          foreach ($pair in @(
            @{ Path = $env:EXE_PATH;    Expected = $env:EXE_HASH;    Label = 'agent executable' },
            @{ Path = $env:CONFIG_PATH; Expected = $env:CONFIG_HASH; Label = 'config file' }
          )) {
            if (-not (Test-Path $pair.Path)) {
              $failures += "$($pair.Label) was removed: $($pair.Path)"
              continue
            }
            $actual = (Get-FileHash -Path $pair.Path -Algorithm SHA256).Hash
            if ($actual -ne $pair.Expected) {
              $failures += "$($pair.Label) changed: $($pair.Expected) -> $actual"
            } else {
              Write-Output "$($pair.Label) unchanged (sha256=$actual)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Output "FAIL: $_" }
            Write-Error "the aborted update modified the installation"
            exit 1
          }
          exit 0

      # The failed stop above left the service in StopPending, and the agent
      # treats only Running as active - so an uninstall issued now would skip the
      # stop entirely instead of exercising it. Start a fresh wedged run so the
      # uninstall meets a Running service, as an operator would.

      - name: Re-wedge the service for the uninstall check
        timeout-minutes: 15
        uses: ./.github/actions/wedged-service
        with:
          mode: rewedge
          service: ${{ matrix.service }}

      - name: Assert the uninstall aborts on a wedged stop
        shell: pwsh
        env:
          IT_BINARY: ${{ matrix.it_binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
          SERVICE: ${{ matrix.service }}
          EXE_PATH: ${{ steps.wedge_hashes.outputs.exe_path }}
          CONFIG_PATH: ${{ steps.wedge_hashes.outputs.config_path }}
          EXE_HASH: ${{ steps.wedge_hashes.outputs.exe_hash }}
          CONFIG_HASH: ${{ steps.wedge_hashes.outputs.config_hash }}
          UNINSTALL_PATHS: ${{ matrix.uninstall_paths }}
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $out = & "./dist/$($env:IT_BINARY)" --uninstall --org-id $env:ORG_ID 2>&1 | Out-String
          $sw.Stop()
          $global:LASTEXITCODE = 0
          $elapsed = [math]::Round($sw.Elapsed.TotalSeconds, 1)
          Write-Output "---- uninstaller output after ${elapsed}s ----"
          Write-Output $out

          $failures = @()
          if ($sw.Elapsed.TotalSeconds -lt 20) {
            $failures += "uninstall returned after ${elapsed}s, before its 25s stop deadline could elapse"
          }
          if ($sw.Elapsed.TotalSeconds -gt 180) {
            $failures += "uninstall took ${elapsed}s, far past its 25s stop deadline"
          }
          foreach ($needle in @(
            'Failed to stop service',
            'did not stop within',
            'Uninstall aborted; nothing was removed'
          )) {
            if (-not $out.Contains($needle)) { $failures += "missing from the log: '$needle'" }
          }
          foreach ($absent in @('Service deleted', 'Directory deleted')) {
            if ($out.Contains($absent)) { $failures += "uninstall proceeded past the failed stop: '$absent'" }
          }

          # Fully intact or fully removed, never mixed: the registration, the
          # installed directories, and both hashed files must all still be there.
          if (-not (Get-Service -Name $env:SERVICE -ErrorAction SilentlyContinue)) {
            $failures += "service registration $($env:SERVICE) was deleted"
          }
          foreach ($path in ($env:UNINSTALL_PATHS -split "`n" | ForEach-Object { $_.Trim() } |
              Where-Object { $_ })) {
            if (-not (Test-Path $path)) { $failures += "installed directory was removed: $path" }
          }
          foreach ($pair in @(
            @{ Path = $env:EXE_PATH;    Expected = $env:EXE_HASH;    Label = 'agent executable' },
            @{ Path = $env:CONFIG_PATH; Expected = $env:CONFIG_HASH; Label = 'config file' }
          )) {
            if (-not (Test-Path $pair.Path)) {
              $failures += "$($pair.Label) was removed: $($pair.Path)"
            } elseif ((Get-FileHash -Path $pair.Path -Algorithm SHA256).Hash -ne $pair.Expected) {
              $failures += "$($pair.Label) changed during the aborted uninstall"
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Output "FAIL: $_" }
            Write-Error "the uninstall did not abort cleanly on a wedged stop"
            exit 1
          }
          Write-Output "Uninstall aborted on the wedged stop after ${elapsed}s with nothing removed"
          exit 0

      # Captured before the restore restarts the real agent, so the delta below
      # can only come from the recovered service.

      - name: Capture recovery baseline counts
        id: wedge_recovery_baseline
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
        run: |
          $content = Get-Content $env:LOG_FILE -Raw -ErrorAction SilentlyContinue
          $subscribed = if ($content) { ([regex]::Matches($content, [regex]::Escape("Subscribed to messages"))).Count } else { 0 }
          "subscribed=$subscribed" >> $env:GITHUB_OUTPUT
          Write-Output "Baseline counts -> subscribed=$subscribed"

      # always(): a failed assertion above must not leave the runner's service
      # registration pointing at the fixture, or the rest of the job (and the
      # final uninstall) would be testing the fixture instead of the agent.

      - name: Restore the agent service after the wedge
        timeout-minutes: 15
        if: always()
        uses: ./.github/actions/wedged-service
        with:
          mode: restore
          service: ${{ matrix.service }}

      - name: Assert the recovered endpoint comes back online
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.wedge_recovery_baseline.outputs.subscribed }}
        run: |
          $baseline = [int]$env:BASELINE
          for ($i = 1; $i -le 60; $i++) {
            $content = Get-Content $env:LOG_FILE -Raw -ErrorAction SilentlyContinue
            $count = if ($content) { ([regex]::Matches($content, [regex]::Escape("Subscribed to messages"))).Count } else { 0 }
            if ($count -gt $baseline) {
              Write-Output "Recovered agent subscribed again (count $count > baseline $baseline) after ~$($i * 2)s"
              exit 0
            }
            Start-Sleep -Seconds 2
          }
          Write-Error "Recovered agent never resubscribed (count stayed at $baseline)"
          exit 1

      - name: Assert a subsequent update succeeds after recovery
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The bound must only catch a wedge: once the endpoint is recovered, an
          # ordinary update stops the service, replaces the binary and starts it
          # again with no behavioral change.
          $out = & "./dist/$($env:BINARY)" --update --org-id $env:ORG_ID --no-auto-updates `
            --github-token $env:GH_TOKEN 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          Write-Output $out

          $failures = @()
          foreach ($needle in @('Agent installed to', 'Service started')) {
            if (-not $out.Contains($needle)) { $failures += "missing from the log: '$needle'" }
          }
          if ($out.Contains('Failed to stop service')) {
            $failures += "a healthy stop was reported as a failure"
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Output "FAIL: $_" }
            Write-Error "the post-recovery update did not complete normally"
            exit 1
          }
          Write-Output "Post-recovery update completed normally"
          exit 0

      # sc-108857: a file locked inside one installed directory must not stop the
      # others from being removed. This is the terminal uninstall on Windows -
      # it deletes the service registration and the data and scripts
      # directories - so the clean uninstall below runs on the other platforms,
      # and Windows keeps its clean-path coverage in the test-service-user job.
      # Windows-only because an open handle only blocks unlink there; see the
      # locked-file action.

      - name: Lock a file in the program directory
        timeout-minutes: 5
        uses: ./.github/actions/locked-file
        with:
          mode: lock
          path: ${{ matrix.program_dir }}

      - name: Assert the uninstall continues past the locked directory
        timeout-minutes: 6
        shell: pwsh
        env:
          # The production binary, not the integration build: this scenario
          # needs no shortened deadlines, and a healthy stop and process exit
          # should be given the real ones rather than a tighter bound that could
          # abort the uninstall on a slow runner.
          BINARY: ${{ matrix.binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
          SERVICE: ${{ matrix.service }}
          LOCKED_DIR: ${{ matrix.program_dir }}
          # The two directories that must still be removed, spelled with the
          # separator the agent logs them with so the log assertions match.
          REMOVED_DIRS: |
            ${{ matrix.config_dir }}\${{ vars.IT_ORG_ID }}
            ${{ matrix.scripts_dir }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-uninstall-continues-past-a-locked-directory.ps1"

      # always(), because a handle left open would make the directory
      # unremovable for the rest of the job - including the assertion below.

      - name: Release the locked file
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/locked-file
        with:
          mode: release

      # Runs on every platform: on Windows this is the state left by the locked
      # scenario plus the by-hand removal of the one directory it named, which
      # is the operator's path back to a clean endpoint.

      - name: Check deleted directories
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

  test-hermetic:
    needs: [set-matrix, build]
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Measured on the first runs; see README "Hermetic command-path job".
    timeout-minutes: 30
    env:
      # One device per job, never shared with another run or platform.
      HERMETIC_DEVICE_ID: hermetic-${{ github.run_id }}-${{ matrix.os }}
      STUB_CONFIG_SECRET: hermetic-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download compiled binary
        uses: ./.github/actions/download-binary
        with:
          name: ${{ matrix.os }}

      - name: Start stub broker and engine
        id: stub_broker
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: start

      - name: Acknowledge subscriptions
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: ack

      - name: Start stub config endpoint pointing at the fixture
        id: stub_config
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: start
          org_id: ${{ vars.IT_ORG_ID }}
          device_id: ${{ env.HERMETIC_DEVICE_ID }}
          hub_host: ${{ steps.stub_broker.outputs.host }}
          engine_host: ${{ steps.stub_broker.outputs.engine_host }}

      - name: Serve a valid configuration
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: ok

      # worker_count 1 so queued commands are observably queued, which is what
      # the kill-and-replay scenario below depends on.

      - name: Install agent against the fixture
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: >-
            --config-url ${{ steps.stub_config.outputs.url }}
            --config-secret ${{ env.STUB_CONFIG_SECRET }}
            --org-id ${{ vars.IT_ORG_ID }}
            --no-auto-updates
            --worker-count 1

      - name: Check service
        timeout-minutes: 5
        uses: ./.github/actions/check-service
        with:
          service: ${{ matrix.service }}

      - name: Wait for subscription to the fixture
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: "0"
          max_attempts: "60"

      # ---- Round trip through the stand-in engine ----

      - name: Send success command through the stub engine
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.stub_broker.outputs.engine_url }}/webhooks/custom/trigger/hermetic/stub
          device_id: ${{ env.HERMETIC_DEVICE_ID }}
          scenario: success

      - name: Check logs for command completion and postback
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      - name: Send failing command through the stub engine
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.stub_broker.outputs.engine_url }}/webhooks/custom/trigger/hermetic/stub
          device_id: ${{ env.HERMETIC_DEVICE_ID }}
          scenario: failure

      # ---- Kill with work queued, restart, every command reported exactly once ----
      # The sc-115628 QA step the live suite could never automate: its
      # send-command waits for each round trip, so nothing could be queued.

      - name: Baseline "Executing commands" before the queued burst
        id: bl_executing
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Executing commands"

      - name: Baseline "Subscribed to messages" before the kill
        id: bl_sub_kill
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Subscribed to messages"

      - name: Queue five slow commands without waiting for results
        timeout-minutes: 5
        shell: pwsh
        env:
          ENGINE_URL: ${{ steps.stub_broker.outputs.engine_url }}
          DEVICE_ID: ${{ env.HERMETIC_DEVICE_ID }}
          SCENARIO: timeout
          COUNT: "5"
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/hermetic-enqueue-commands.ps1"

      - name: Wait for the first queued command to start executing
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Executing commands
          baseline_count: ${{ steps.bl_executing.outputs.count }}
          max_attempts: "60"

      - name: Kill the agent with one command running and four queued
        timeout-minutes: 5
        uses: ./.github/actions/kill-service
        with:
          service: ${{ matrix.service }}

      # systemd (Restart=always) and launchd (KeepAlive) bring the agent back on
      # their own; the Windows SCM has no recovery configured, so start it.

      - name: Start the agent again
        timeout-minutes: 5
        uses: ./.github/actions/start-service
        with:
          service: ${{ matrix.service }}

      - name: Wait for the restarted agent to subscribe
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.bl_sub_kill.outputs.count }}
          max_attempts: "60"

      - name: Assert every queued command is reported exactly once, one of them interrupted
        timeout-minutes: 10
        shell: pwsh
        env:
          ENGINE_URL: ${{ steps.stub_broker.outputs.engine_url }}
          COUNT: "5"
          TIMEOUT_SECONDS: "420"
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/hermetic-assert-postbacks.ps1"

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Stop stub config endpoint
        if: always()
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: stop

      - name: Stop stub broker and engine
        if: always()
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: stop

  test-service-user:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 2x the p95 of the last 20 runs (see README "Bounding the e2e jobs").
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Provision service account
        timeout-minutes: 5
        id: provision
        uses: ./.github/actions/provision-service-user
        with:
          username: ${{ matrix.service_user }}

      - name: Install agent as service account
        timeout-minutes: 20
        uses: ./.github/actions/install-agent
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service_username: ${{ matrix.service_username_arg }}
          service_password: ${{ steps.provision.outputs.password }}

      - name: Assert service runs as account (config flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-service-identity
        with:
          service: ${{ matrix.service }}
          expected_identity: ${{ matrix.service_identity }}

      - name: Validate config and get device id
        timeout-minutes: 5
        uses: ./.github/actions/validate-config
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}

      - name: Assert password absent from config (config flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-config-secret-absent
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          secret: ${{ steps.provision.outputs.password }}

      - name: Re-register service via update flow
        uses: ./.github/actions/update-as-service-user
        with:
          binary: ${{ matrix.binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service_username: ${{ matrix.service_username_arg }}
          service_password: ${{ steps.provision.outputs.password }}

      - name: Assert service runs as account (update flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-service-identity
        with:
          service: ${{ matrix.service }}
          expected_identity: ${{ matrix.service_identity }}

      - name: Assert password absent from config (update flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-config-secret-absent
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          secret: ${{ steps.provision.outputs.password }}

      - name: Uninstall agent
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --uninstall --org-id ${{ vars.IT_ORG_ID }}

      - name: Check deleted directories
        timeout-minutes: 5
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      - name: Remove service account
        if: always()
        uses: ./.github/actions/remove-service-user
        with:
          username: ${{ matrix.service_user }}

  test-config-response-cap:
    permissions:
      contents: read
    needs: [build, set-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 2x the p95 of the last 20 runs (see README "Bounding the e2e jobs").
    timeout-minutes: 5
    env:
      # 10 MiB, matching maxConfigResponseSize in cmd/agent_smith/config_context.go.
      # Spelled in bytes because that is how the agent's error reports it.
      MAX_CONFIG_RESPONSE_BYTES: "10485760"
      # 1 GiB on offer - two orders of magnitude past the ceiling, so a bounded
      # read and an unbounded one are nowhere near each other in the byte count
      # the endpoint reports.
      OVERSIZED_BYTES: "1073741824"
      # What the endpoint is allowed to have delivered before the agent hung up:
      # the 10 MiB ceiling plus generous room for bytes the socket buffers had
      # already accepted (a loopback exchange measured ~12.6 MiB), and still 16x
      # below the body on offer.
      MAX_BYTES_READ: "67108864"
      # The stub answers on loopback and checks nothing, so this stands in for
      # IT_CONFIG_SECRET rather than exposing it to a fixture.
      STUB_CONFIG_SECRET: "stub-config-secret"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Downloaded here rather than through the install-agent action, which
      # would fetch the same artifacts a second time: this job drives config
      # mode directly, since the oversized leg expects it to fail.

      - name: Download compiled binary
        uses: ./.github/actions/download-binary
        with:
          name: ${{ matrix.os }}

      - name: Start stub config endpoint
        timeout-minutes: 15
        id: stub_config
        uses: ./.github/actions/stub-config
        with:
          mode: start
          org_id: ${{ vars.IT_ORG_ID }}
          oversized_bytes: ${{ env.OVERSIZED_BYTES }}

      - name: Assert the oversized config response is rejected
        timeout-minutes: 6
        shell: pwsh
        env:
          # The production binary, not the integration build: nothing here
          # depends on a shortened deadline, and the point of the timing
          # assertion is that the real 5-minute configHTTPTimeout was never what
          # ended the read.
          BINARY: ${{ matrix.binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
          CONFIG_URL: ${{ steps.stub_config.outputs.url }}
          CONFIG_SECRET: ${{ env.STUB_CONFIG_SECRET }}
          MAX_BYTES: ${{ env.MAX_CONFIG_RESPONSE_BYTES }}
          # Far below configHTTPTimeout's 300s, far above the seconds the host
          # info gathering ahead of the fetch costs even on a slow runner.
          MAX_ELAPSED_SECONDS: "120"
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-the-oversized-config-response-is-rejected.ps1"

      - name: Assert the oversized response was not read whole
        timeout-minutes: 6
        shell: pwsh
        env:
          STUB_LOG: ${{ steps.stub_config.outputs.log_file }}
          MAX_BYTES_READ: ${{ env.MAX_BYTES_READ }}
          TOTAL_BYTES: ${{ env.OVERSIZED_BYTES }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-the-oversized-response-was-not-read-whole.ps1"

      # A rejected fetch must leave the machine untouched, not half-installed:
      # the abort happens before the data directory is created, so none of the
      # paths a real install creates should exist.

      - name: Assert nothing was installed by the rejected fetch
        timeout-minutes: 5
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      # ---- Control leg: a legitimate payload still installs ----
      # A ceiling that also rejected real configurations would satisfy every
      # assertion above and break every install, so the same endpoint now serves
      # the small valid config an install actually gets (a couple of hundred
      # bytes - four orders of magnitude under the ceiling).

      - name: Serve a valid configuration
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: ok

      - name: Install agent against the valid configuration
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: >-
            --config-url ${{ steps.stub_config.outputs.url }}
            --config-secret ${{ env.STUB_CONFIG_SECRET }}
            --org-id ${{ vars.IT_ORG_ID }}
            --no-auto-updates

      - name: Check service
        timeout-minutes: 5
        uses: ./.github/actions/check-service
        with:
          service: ${{ matrix.service }}

      - name: Validate config and get device id
        timeout-minutes: 5
        id: validate_config
        uses: ./.github/actions/validate-config
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}

      # The device id proves the written config is the one the endpoint served,
      # read in full and intact - not a truncated or otherwise mangled body that
      # happened to satisfy the required-fields check.

      - name: Assert the served configuration was written intact
        shell: pwsh
        env:
          DEVICE_ID: ${{ steps.validate_config.outputs.device_id }}
          HUB_HOST: ${{ steps.validate_config.outputs.azure_iot_hub_host }}
        run: |
          $failures = @()
          if ($env:DEVICE_ID -ne 'stub-device-id') {
            $failures += "device_id is '$($env:DEVICE_ID)', not the served 'stub-device-id'"
          }
          if ($env:HUB_HOST -ne 'hub.invalid') {
            $failures += "azure_iot_hub_host is '$($env:HUB_HOST)', not the served 'hub.invalid'"
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Output "FAIL: $_" }
            Write-Error "the installed config does not match what the endpoint served"
            exit 1
          }
          Write-Output "The installed config matches the served payload"

      # No always(): on a runner this job owns and discards, leaving a failed
      # install in place is better than an uninstall of something that was never
      # installed reporting a second, unrelated failure over the real one.

      - name: Uninstall agent
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --uninstall --org-id ${{ vars.IT_ORG_ID }}

      - name: Check deleted directories
        timeout-minutes: 5
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      # always(), because the endpoint's request log is the byte-count record
      # this scenario is read from - it has to be reported on a failure most of
      # all.

      - name: Stop stub config endpoint
        timeout-minutes: 15
        if: always()
        uses: ./.github/actions/stub-config
        with:
          mode: stop
