      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

  connection:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, auto-update]
    # Chained behind the previous scenario job, not parallel to it: the live
    # config endpoint gives every install on a platform the same device id, so
    # two scenario agents at once kick each other off IoT Hub and commands land
    # on whichever holds the connection. Parallelism returns with the hermetic
    # migration (sc-126319), where each job has its own device identity. The
    # chain never skips a scenario because an earlier one failed: each starts
    # from a fresh install and reports on its own.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first chained runs (README
    # "Bounding the e2e jobs").
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Fresh install from the live config endpoint; every scenario job starts here.
      # Bounded below the job so a hung install is attributed to this step.

      - name: Set up the scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/e2e-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service: ${{ matrix.service }}
          config_dir: ${{ matrix.config_dir }}

      # ---- MQTT reconnection scenario ----
      # Force a transient broker outage and verify the agent tears down, backs
      # off, resubscribes, and resumes command delivery exactly once. Counts are
      # captured up front and compared as deltas because the log already contains
      # "Subscribed to messages"/"Command completed" lines from earlier cycles
      # (the service has restarted several times by now and the log is not reset
      # while the service holds it open).

      - name: Capture reconnect baseline counts
        id: reconnect_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-reconnect-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Baseline "Connection lost" before the broker disruption
        id: bl_connection_lost
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Connection lost"

      - name: Disrupt broker connection
        timeout-minutes: 5
        uses: ./.github/actions/disrupt-connection
        with:
          mode: block
          host: ${{ steps.setup.outputs.azure_iot_hub_host }}

      - name: Wait for connection lost detection
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Connection lost
          baseline_count: ${{ steps.bl_connection_lost.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      - name: Assert connection lost and reconnect/backoff activity
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          patterns: |
            Connection lost
            Reconnecting in
            Reconnecting...

      - name: Restore broker connection
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/disrupt-connection
        with:
          mode: restore
          host: ${{ steps.setup.outputs.azure_iot_hub_host }}

      - name: Wait for fresh subscription after reconnect
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: wait-for-fresh-subscription-after-reconnect
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.reconnect_baseline.outputs.subscribed }}

      - name: Send command after reconnect
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert command executed exactly once after reconnect
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-command-executed-exactly-once-after-reconnect
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.reconnect_baseline.outputs.completed }}

      - name: Baseline "Subscribed to messages" before the short-SAS install
        id: bl_sub_sas_update
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Subscribed to messages"

      # Baseline before the event so the wait below needs a *new* line (sc-117884).

      - name: Baseline "Renewing SAS token before expiry" before the short-SAS install
        id: bl_sas_renewed
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Renewing SAS token before expiry"

      - name: Install IT binary with short SAS token lifetime
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.it_binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --no-auto-updates --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for fresh subscription after SAS lifetime update
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.bl_sub_sas_update.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      - name: Capture SAS renewal baseline counts
        id: sas_renewal_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-sas-renewal-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Wait for proactive SAS token renewal
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Renewing SAS token before expiry
          baseline_count: ${{ steps.bl_sas_renewed.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      - name: Assert SAS token renewed and agent resubscribed with fresh token
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-sas-token-renewed-and-agent-resubscribed-with-fresh-token
        env:
          LOG_FILE: ${{ matrix.log_file }}
          RENEWED_BASELINE: ${{ steps.sas_renewal_baseline.outputs.renewed }}
          SUBSCRIBED_BASELINE: ${{ steps.sas_renewal_baseline.outputs.subscribed }}

      - name: Assert SAS renewal was graceful (no forced disconnect)
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-sas-renewal-was-graceful-no-forced-disconnect
        env:
          LOG_FILE: ${{ matrix.log_file }}
          LOST_BASELINE: ${{ steps.sas_renewal_baseline.outputs.lost }}

      - name: Send command after SAS renewal
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ vars.IT_SEND_COMMAND_TRIGGER_URL }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert command delivery continues after SAS renewal
        timeout-minutes: 6
        uses: ./.github/actions/it-script
        with:
          script: assert-command-delivery-continues-after-sas-renewal
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.sas_renewal_baseline.outputs.completed }}

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

  wedged-broker:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix, connection]
