      - name: Stop stub broker and engine
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-broker
        with:
          mode: stop


  # ---- Hermetic, Windows-only: child-process kill through the job object ----
  hermetic-child-process:
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    # Hermetic: own device id, no Rewst or Azure, so it runs in parallel with
    # every other job and gates the merge from day one (the kill-and-replay
    # job keeps its soak-period continue-on-error separately).
    if: ${{ contains(fromJson(needs.set-matrix.outputs.matrix).include.*.os, 'windows-latest') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.windows_matrix) }}
    runs-on: ${{ matrix.os }}
    # Provisional bound; re-measured from the first runs (README "Bounding the e2e jobs").
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Stub broker, stand-in engine and stub config endpoint on the runner, then
      # an install from them under this job's own device id (sc-126319).
      - name: Set up the hermetic scenario
        timeout-minutes: 20
        id: setup
        uses: ./.github/actions/hermetic-setup
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          device_id: hermetic-${{ github.run_id }}-${{ matrix.os }}-child-process
          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}

      - name: Baseline "Subscribed to messages" before the child-process timeout update
        id: bl_sub_child_update
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Subscribed to messages"

      - name: Enable a longer command timeout for the child-process scenario
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --update --org-id ${{ vars.IT_ORG_ID }} --command-timeout-seconds 15 --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for fresh subscription after child-process-scenario timeout update
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.bl_sub_child_update.outputs.count }}
          max_attempts: "60"
          interval_seconds: "2"

      - name: Capture child-process-kill baseline counts
        id: child_process_kill_baseline
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/capture-command-timeout-baseline-counts.ps1"

      # send-command (the composite action used everywhere else in this file)
      # blocks until the device's postback round-trips back - confirmed by the
      # first attempt at this scenario, where that call alone took ~11-25s for
      # a 5-15s configured timeout. For every other scenario that is fine
      # because they only ever inspect the agent's log afterward, but here it
      # means the full timeout+kill cycle has already completed by the time a
      # following step could check the child's *live* process state - too
      # late to distinguish "job object correctly killed it" from "it never
      # spawned at all", which is exactly the distinction this scenario needs
      # to make. So the same curl call is sent in the background here, polled
      # for the child appearing while it (and the parent's timeout) are still
      # running, and only then waited on for its own completion.

      - name: Send command that spawns a child process and hangs, then wait for it to start
        timeout-minutes: 6
        shell: bash
        env:
          TRIGGER_URL: ${{ steps.setup.outputs.trigger_url }}
          DEVICE_ID: ${{ steps.setup.outputs.device_id }}
          SCENARIO: child_process_hang
          E2E_CATALOG: ${{ github.workspace }}/.github/workflows/e2e-commands.json
        run: |
          # The command comes from the catalog like every other send; this job
          # is Windows-only, hence the windows family.
          COMMANDS="$(jq -er --arg s "$SCENARIO" '.[$s].windows' "$E2E_CATALOG")" \
            || { echo "::error::scenario $SCENARIO has no windows command in $E2E_CATALOG"; exit 1; }
          # This scenario cannot use the send-command action (it needs the call
          # backgrounded so it can inspect the child's live process state), but it
          # must not re-introduce the bug that action exists to fix: a discarded
          # response means an engine that never dispatched the command is reported
          # as success, and the assertion below fails instead. Same checks, inline.
          # Unlike the sweep scenario this one does not depend on the engine
          # timeout - it reinstalls with a 15s command timeout above, so the
          # postback round-trips long before the engine's ceiling.
          set -uo pipefail
          resp="$RUNNER_TEMP/child-scenario-response.json"
          curl --silent --show-error --location \
            --max-time 300 \
            --write-out '\n%{http_code}' \
            --form "device_id=\"$DEVICE_ID\"" \
            --form "commands=$COMMANDS" \
            "$TRIGGER_URL" > "$resp" &
          curl_pid=$!

          pwsh -NoProfile -File "$GITHUB_WORKSPACE/.github/workflows/it-scripts/wait-for-child-process-to-start.ps1"

          curl_exit=0
          wait "$curl_pid" || curl_exit=$?

          response="$(cat "$resp")"
          http_code="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"
          echo "Response body: ${body}"

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error title=send-command (child-process): request failed::curl exited $curl_exit; the command was not dispatched to the device"
            exit 1
          fi

          if [ "$http_code" = "408" ] || printf '%s' "$body" | grep -qF 'did not complete in a reasonable amount of time'; then
            echo "::error title=send-command (child-process): Rewst engine timed out::the engine did not dispatch the command before giving up (HTTP $http_code). Engine-side, NOT a regression in the code under test - re-dispatch rather than investigating the diff."
            exit 1
          fi

          case "$http_code" in
            2??) ;;
            *)
              echo "::error title=send-command (child-process): HTTP $http_code::the Rewst engine returned $http_code; the command was not dispatched to the device"
              exit 1
              ;;
          esac

      - name: Assert hanging parent command was killed by the timeout (child-process scenario)
        timeout-minutes: 6
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.child_process_kill_baseline.outputs.timed_out }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-hanging-command-was-killed-by-the-timeout.ps1"

      - name: Assert the child process did not survive the timeout kill
        timeout-minutes: 6
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-child-process-terminated.ps1"

      - name: Send command after child-process scenario
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.setup.outputs.trigger_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          scenario: success

      - name: Assert worker pool recovered after child-process scenario
        timeout-minutes: 6
        shell: pwsh
        env:
          LOG_FILE: ${{ matrix.log_file }}
          BASELINE: ${{ steps.child_process_kill_baseline.outputs.completed }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-worker-pool-recovered-after-timeout.ps1"

      # Every scenario above asserts on the agent log; when one fails, the log is
      # the evidence. Dump its tail so triage does not need a re-run with extra
      # steps (three runs on 2026-09-22 were diagnosed from postback bodies alone).

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Stop stub config endpoint
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-config
        with:
          mode: stop

      - name: Stop stub broker and engine
        timeout-minutes: 5
        if: always()
        uses: ./.github/actions/stub-broker
        with:
          mode: stop


  test-hermetic:
    needs: [set-matrix, build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Measured on the first runs; see README "Hermetic command-path job".
    timeout-minutes: 30
    env:
      # One device per job, never shared with another run or platform.
      HERMETIC_DEVICE_ID: hermetic-${{ github.run_id }}-${{ matrix.os }}
      STUB_CONFIG_SECRET: hermetic-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download compiled binary
        uses: ./.github/actions/download-binary
        with:
          name: ${{ matrix.os }}

      - name: Start stub broker and engine
        id: stub_broker
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: start

      - name: Acknowledge subscriptions
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: ack

      - name: Start stub config endpoint pointing at the fixture
        id: stub_config
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: start
          org_id: ${{ vars.IT_ORG_ID }}
          device_id: ${{ env.HERMETIC_DEVICE_ID }}
          hub_host: ${{ steps.stub_broker.outputs.host }}
          engine_host: ${{ steps.stub_broker.outputs.engine_host }}

      - name: Serve a valid configuration
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: ok

      # worker_count 1 so queued commands are observably queued, which is what
      # the kill-and-replay scenario below depends on.

      - name: Install agent against the fixture
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: >-
            --config-url ${{ steps.stub_config.outputs.url }}
            --config-secret ${{ env.STUB_CONFIG_SECRET }}
            --org-id ${{ vars.IT_ORG_ID }}
            --no-auto-updates
            --worker-count 1

      - name: Check service
        timeout-minutes: 5
        uses: ./.github/actions/check-service
        with:
          service: ${{ matrix.service }}

      - name: Wait for subscription to the fixture
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: "0"
          max_attempts: "60"

      # ---- Round trip through the stand-in engine ----

      - name: Send success command through the stub engine
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.stub_broker.outputs.engine_url }}/webhooks/custom/trigger/hermetic/stub
          device_id: ${{ env.HERMETIC_DEVICE_ID }}
          scenario: success

      - name: Check logs for command completion and postback
        timeout-minutes: 5
        uses: ./.github/actions/assert-log-contains
        with:
          log_file: ${{ matrix.log_file }}
          scenario: success

      - name: Send failing command through the stub engine
        timeout-minutes: 20
        uses: ./.github/actions/send-command
        with:
          trigger_url: ${{ steps.stub_broker.outputs.engine_url }}/webhooks/custom/trigger/hermetic/stub
          device_id: ${{ env.HERMETIC_DEVICE_ID }}
          scenario: failure

      # ---- Kill with work queued, restart, every command reported exactly once ----
      # The sc-115628 QA step the live suite could never automate: its
      # send-command waits for each round trip, so nothing could be queued.

      - name: Baseline "Executing commands" before the queued burst
        id: bl_executing
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Executing commands"

      - name: Baseline "Subscribed to messages" before the kill
        id: bl_sub_kill
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Subscribed to messages"

      - name: Queue five slow commands without waiting for results
        timeout-minutes: 5
        shell: pwsh
        env:
          ENGINE_URL: ${{ steps.stub_broker.outputs.engine_url }}
          DEVICE_ID: ${{ env.HERMETIC_DEVICE_ID }}
          SCENARIO: timeout
          COUNT: "5"
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/hermetic-enqueue-commands.ps1"

      - name: Wait for the first queued command to start executing
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Executing commands
          baseline_count: ${{ steps.bl_executing.outputs.count }}
          max_attempts: "60"

      - name: Kill the agent with one command running and four queued
        timeout-minutes: 5
        uses: ./.github/actions/kill-service
        with:
          service: ${{ matrix.service }}

      # systemd (Restart=always) and launchd (KeepAlive) bring the agent back on
      # their own; the Windows SCM has no recovery configured, so start it.

      - name: Start the agent again
        timeout-minutes: 5
        uses: ./.github/actions/start-service
        with:
          service: ${{ matrix.service }}

      - name: Wait for the restarted agent to subscribe
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Subscribed to messages
          baseline_count: ${{ steps.bl_sub_kill.outputs.count }}
          max_attempts: "60"

      - name: Assert every queued command is reported exactly once, one of them interrupted
        timeout-minutes: 10
        shell: pwsh
        env:
          ENGINE_URL: ${{ steps.stub_broker.outputs.engine_url }}
          COUNT: "5"
          TIMEOUT_SECONDS: "420"
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/hermetic-assert-postbacks.ps1"

      - name: Dump agent log on failure
        if: failure()
        uses: ./.github/actions/dump-agent-log
        with:
          log_file: ${{ matrix.log_file }}

      - name: Stop stub config endpoint
        if: always()
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: stop

      - name: Stop stub broker and engine
        if: always()
        timeout-minutes: 15
        uses: ./.github/actions/stub-broker
        with:
          mode: stop

  live-service-user:
    permissions:
      contents: read
    # Live smoke (sc-126320): installs from the Rewst config endpoint and talks
    # to the real hub and engine, so it can go red for reasons that are not
    # the agent (the hub's daily quota, an expired integration token, the
    # engine's ceiling). It no longer gates the merge - the hermetic jobs do -
    # and reports its outcome in the job summary instead.
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [build, build-integration-test, set-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 2x the p95 of the last 20 runs (see README "Bounding the e2e jobs").
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Provision service account
        timeout-minutes: 5
        id: provision
        uses: ./.github/actions/provision-service-user
        with:
          username: ${{ matrix.service_user }}

      - name: Install agent as service account
        timeout-minutes: 20
        uses: ./.github/actions/install-agent
        with:
          os: ${{ matrix.os }}
          binary: ${{ matrix.binary }}
          it_binary: ${{ matrix.it_binary }}
          config_url: ${{ vars.IT_CONFIG_URL }}
          config_secret: ${{ secrets.IT_CONFIG_SECRET }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service_username: ${{ matrix.service_username_arg }}
          service_password: ${{ steps.provision.outputs.password }}

      - name: Assert service runs as account (config flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-service-identity
        with:
          service: ${{ matrix.service }}
          expected_identity: ${{ matrix.service_identity }}

      - name: Validate config and get device id
        timeout-minutes: 5
        uses: ./.github/actions/validate-config
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}

      - name: Assert password absent from config (config flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-config-secret-absent
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          secret: ${{ steps.provision.outputs.password }}

      - name: Re-register service via update flow
        uses: ./.github/actions/update-as-service-user
        with:
          binary: ${{ matrix.binary }}
          org_id: ${{ vars.IT_ORG_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          service_username: ${{ matrix.service_username_arg }}
          service_password: ${{ steps.provision.outputs.password }}

      - name: Assert service runs as account (update flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-service-identity
        with:
          service: ${{ matrix.service }}
          expected_identity: ${{ matrix.service_identity }}

      - name: Assert password absent from config (update flow)
        timeout-minutes: 5
        uses: ./.github/actions/assert-config-secret-absent
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}
          secret: ${{ steps.provision.outputs.password }}

      - name: Uninstall agent
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --uninstall --org-id ${{ vars.IT_ORG_ID }}

      - name: Check deleted directories
        timeout-minutes: 5
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      - name: Remove service account
        if: always()
        uses: ./.github/actions/remove-service-user
        with:
          username: ${{ matrix.service_user }}

      - name: Record the live smoke outcome
        if: always()
        uses: ./.github/actions/smoke-summary
        with:
          job: live-service-user
          outcome: ${{ job.status }}


  test-config-response-cap:
    permissions:
      contents: read
    needs: [build, set-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 2x the p95 of the last 20 runs (see README "Bounding the e2e jobs").
    timeout-minutes: 5
    env:
      # 10 MiB, matching maxConfigResponseSize in cmd/agent_smith/config_context.go.
      # Spelled in bytes because that is how the agent's error reports it.
      MAX_CONFIG_RESPONSE_BYTES: "10485760"
      # 1 GiB on offer - two orders of magnitude past the ceiling, so a bounded
      # read and an unbounded one are nowhere near each other in the byte count
      # the endpoint reports.
      OVERSIZED_BYTES: "1073741824"
      # What the endpoint is allowed to have delivered before the agent hung up:
      # the 10 MiB ceiling plus generous room for bytes the socket buffers had
      # already accepted (a loopback exchange measured ~12.6 MiB), and still 16x
      # below the body on offer.
      MAX_BYTES_READ: "67108864"
      # The stub answers on loopback and checks nothing, so this stands in for
      # IT_CONFIG_SECRET rather than exposing it to a fixture.
      STUB_CONFIG_SECRET: "stub-config-secret"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Downloaded here rather than through the install-agent action, which
      # would fetch the same artifacts a second time: this job drives config
      # mode directly, since the oversized leg expects it to fail.

      - name: Download compiled binary
        uses: ./.github/actions/download-binary
        with:
          name: ${{ matrix.os }}

      - name: Start stub config endpoint
        timeout-minutes: 15
        id: stub_config
        uses: ./.github/actions/stub-config
        with:
          mode: start
          org_id: ${{ vars.IT_ORG_ID }}
          oversized_bytes: ${{ env.OVERSIZED_BYTES }}

      - name: Assert the oversized config response is rejected
        timeout-minutes: 6
        shell: pwsh
        env:
          # The production binary, not the integration build: nothing here
          # depends on a shortened deadline, and the point of the timing
          # assertion is that the real 5-minute configHTTPTimeout was never what
          # ended the read.
          BINARY: ${{ matrix.binary }}
          ORG_ID: ${{ vars.IT_ORG_ID }}
          CONFIG_URL: ${{ steps.stub_config.outputs.url }}
          CONFIG_SECRET: ${{ env.STUB_CONFIG_SECRET }}
          MAX_BYTES: ${{ env.MAX_CONFIG_RESPONSE_BYTES }}
          # Far below configHTTPTimeout's 300s, far above the seconds the host
          # info gathering ahead of the fetch costs even on a slow runner.
          MAX_ELAPSED_SECONDS: "120"
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-the-oversized-config-response-is-rejected.ps1"

      - name: Assert the oversized response was not read whole
        timeout-minutes: 6
        shell: pwsh
        env:
          STUB_LOG: ${{ steps.stub_config.outputs.log_file }}
          MAX_BYTES_READ: ${{ env.MAX_BYTES_READ }}
          TOTAL_BYTES: ${{ env.OVERSIZED_BYTES }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/assert-the-oversized-response-was-not-read-whole.ps1"

      # A rejected fetch must leave the machine untouched, not half-installed:
      # the abort happens before the data directory is created, so none of the
      # paths a real install creates should exist.

      - name: Assert nothing was installed by the rejected fetch
        timeout-minutes: 5
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      # ---- Control leg: a legitimate payload still installs ----
      # A ceiling that also rejected real configurations would satisfy every
      # assertion above and break every install, so the same endpoint now serves
      # the small valid config an install actually gets (a couple of hundred
      # bytes - four orders of magnitude under the ceiling).

      - name: Serve a valid configuration
        timeout-minutes: 15
        uses: ./.github/actions/stub-config
        with:
          mode: ok

      - name: Install agent against the valid configuration
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: >-
            --config-url ${{ steps.stub_config.outputs.url }}
            --config-secret ${{ env.STUB_CONFIG_SECRET }}
            --org-id ${{ vars.IT_ORG_ID }}
            --no-auto-updates

      - name: Check service
        timeout-minutes: 5
        uses: ./.github/actions/check-service
        with:
          service: ${{ matrix.service }}

      - name: Validate config and get device id
        timeout-minutes: 5
        id: validate_config
        uses: ./.github/actions/validate-config
        with:
          config_dir: ${{ matrix.config_dir }}
          org_id: ${{ vars.IT_ORG_ID }}

      # The device id proves the written config is the one the endpoint served,
      # read in full and intact - not a truncated or otherwise mangled body that
      # happened to satisfy the required-fields check.

      - name: Assert the served configuration was written intact
        shell: pwsh
        env:
          DEVICE_ID: ${{ steps.validate_config.outputs.device_id }}
          HUB_HOST: ${{ steps.validate_config.outputs.azure_iot_hub_host }}
        run: |
          $failures = @()
          if ($env:DEVICE_ID -ne 'stub-device-id') {
            $failures += "device_id is '$($env:DEVICE_ID)', not the served 'stub-device-id'"
          }
          if ($env:HUB_HOST -ne 'hub.invalid') {
            $failures += "azure_iot_hub_host is '$($env:HUB_HOST)', not the served 'hub.invalid'"
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Output "FAIL: $_" }
            Write-Error "the installed config does not match what the endpoint served"
            exit 1
          }
          Write-Output "The installed config matches the served payload"

      # No always(): on a runner this job owns and discards, leaving a failed
      # install in place is better than an uninstall of something that was never
      # installed reporting a second, unrelated failure over the real one.

      - name: Uninstall agent
        timeout-minutes: 10
        uses: ./.github/actions/run-agent
        with:
          binary: ${{ matrix.binary }}
          args: --uninstall --org-id ${{ vars.IT_ORG_ID }}

      - name: Check deleted directories
        timeout-minutes: 5
        uses: ./.github/actions/assert-uninstalled
        with:
          paths: ${{ matrix.uninstall_paths }}

      # always(), because the endpoint's request log is the byte-count record
      # this scenario is read from - it has to be reported on a failure most of
      # all.

      - name: Stop stub config endpoint
        timeout-minutes: 15
        if: always()
        uses: ./.github/actions/stub-config
        with:
          mode: stop
