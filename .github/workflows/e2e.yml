          service: ${{ matrix.service }}
          log_file: ${{ matrix.log_file }}

      - name: Capture reconnect baseline counts
        id: reconnect_baseline
        uses: ./.github/actions/it-script
        with:
          script: capture-reconnect-baseline-counts
        env:
          LOG_FILE: ${{ matrix.log_file }}

      - name: Baseline "Connection lost" before the broker disruption
        id: bl_connection_lost
        uses: ./.github/actions/capture-log-count
        with:
          log_file: ${{ matrix.log_file }}
          pattern: "Connection lost"

      - name: Take the device offline at the stub broker
        timeout-minutes: 5
        uses: ./.github/actions/stub-broker
        with:
          mode: offline
          engine_url: ${{ steps.setup.outputs.engine_url }}
          device_id: ${{ steps.setup.outputs.device_id }}
          offline_seconds: "45"

      - name: Wait for connection lost detection
        timeout-minutes: 6
        uses: ./.github/actions/wait-for-log-line
        with:
          log_file: ${{ matrix.log_file }}
          pattern: Connection lost
          baseline_count: ${{ steps.bl_connection_lost.outputs.count }}
