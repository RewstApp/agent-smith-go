name: Send command
description: >-
  Send a command to the agent via the Rewst trigger webhook and classify the
  engine's answer. Every outcome is one of: request-failed, engine-timeout,
  engine-transient, engine-refusal, wrong-result, success - named in the
  step's annotation so triage never needs the raw log. See send-command.sh.

inputs:
  trigger_url:
    description: "Rewst trigger URL"
    required: true
  device_id:
    description: "Target device id"
    required: true
  commands:
    description: "Raw value for the curl --form commands=... field. Should already include any surrounding quoting expected by the Rewst engine."
    required: true
  expected_output:
    description: >-
      When set, a 2xx response must carry a command_results.output containing
      this text, otherwise the step fails as wrong-result. Catches the engine
      returning another command's postback (two agents on one device_id) at
      this step rather than at the log assertion after it. Leave empty for
      commands whose output is not fixed (floods, timeouts, failures).
    required: false
    default: ""
  max_time:
    description: "Hard ceiling, in seconds, on the whole curl request. A backstop against a connection that never answers, not a latency policy - the engine's own ceiling is well below this."
    required: false
    default: "300"
  retry_attempts:
    description: >-
      Total attempts at the engine round-trip when it ends in an engine-timeout
      (HTTP 408, or a 2xx carrying the timeout payload) or an engine-transient
      (any 5xx, or a 404 whose body says the workflow was not found). Both are
      engine-side and pass on the next attempt; each used to fail the whole
      run. A refusal, a wrong result or a curl error still fails on the first
      attempt. Set to "1" to disable. Note that an engine-timeout means the
      engine stopped waiting, not that the device never got the command, so a
      retry dispatches a duplicate; after one, a mismatched expected_output is
      a warning rather than a failure.
    required: false
    default: "3"
  retry_delay_seconds:
    description: "Pause between retries."
    required: false
    default: "10"
  allow_engine_timeout:
    description: >-
      Set to "true" only for a scenario that needs the command to still be
      running on the device when this step returns. This action blocks until the
      device's postback round-trips, so for a command that outlives the engine's
      own ceiling the engine giving up is the only thing that returns the send
      early - the scenario depends on it rather than being broken by it. When
      true, an engine-timeout is logged and the step continues; every other
      class still behaves as normal.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Send command
      shell: bash
      env:
        TRIGGER_URL: ${{ inputs.trigger_url }}
        DEVICE_ID: ${{ inputs.device_id }}
        COMMANDS: ${{ inputs.commands }}
        EXPECTED_OUTPUT: ${{ inputs.expected_output }}
        MAX_TIME: ${{ inputs.max_time }}
        ALLOW_ENGINE_TIMEOUT: ${{ inputs.allow_engine_timeout }}
        RETRY_ATTEMPTS: ${{ inputs.retry_attempts }}
        RETRY_DELAY: ${{ inputs.retry_delay_seconds }}
      # The script lives in its own file so test/sendcommand can run it against
      # stub servers. Backslashes are normalised for Git Bash on windows-latest.
      run: bash "${GITHUB_ACTION_PATH//\\//}/send-command.sh"
