name: Stub config endpoint
description: >
  Run the test/stubconfig fixture on the loopback interface as a stand-in for
  the Rewst config endpoint, so install-time config mode can be pointed at a
  response far larger than any real configuration and the size ceiling
  sc-112405 added can be observed aborting the install (README section
  "Bounded Config-Fetch Response"). The real config endpoint cannot be made to
  serve an oversized body on demand, and an unroutable address produces a
  connection error rather than the 200-with-an-enormous-body the ticket
  describes.

  The endpoint answers over plain HTTP on 127.0.0.1, so - unlike the stub
  broker - nothing has to be installed into the host trust store. The agent is
  pointed at it by passing the url output as --config-url.

  On Windows the fixture must be launched detached (via WMI), because a child
  started with Start-Process -NoNewWindow shares the launching step's console
  and job object and is reaped when that step ends - the lesson the stub broker
  learned the hard way.

  mode=start builds and launches the endpoint in oversized mode and verifies it
  is listening before any agent is pointed at it, so a broken fixture fails here
  rather than as a mystifying assertion failure a minute later. mode=ok /
  mode=oversized flip the behavior per request without restarting anything.
  mode=stop tears it down and reports its request log (the byte-count record the
  scenario asserts on); it is idempotent and tolerant of missing state, so an
  always() cleanup step can run it even if start never completed.

inputs:
  mode:
    description: "start, ok, oversized, or stop"
    required: true
  host:
    description: "Loopback address the endpoint answers on"
    required: false
    default: "127.0.0.1"
  port:
    description: >
      Port to listen on. Deliberately not the stub release endpoint's 8765, so
      both fixtures can be up in the same job without colliding.
    required: false
    default: "8766"
  org_id:
    description: >
      rewst_org_id served in the configuration. Must match the --org-id the
      agent is installed with, or the install rejects the config. Only takes
      effect at mode=start.
    required: false
    default: ""
  oversized_bytes:
    description: >
      How many bytes the oversized response streams. The default is 1 GiB -
      two orders of magnitude past the agent's 10 MiB maxConfigResponseSize, so
      an agent that honors the ceiling and one that buffers the whole body are
      not close to each other in the fixture's byte count. Only takes effect at
      mode=start.
    required: false
    default: "1073741824"

outputs:
  url:
    description: "Config endpoint URL to pass as --config-url"
    value: http://${{ inputs.host }}:${{ inputs.port }}/configure
  log_file:
    description: "Path the endpoint's request log is written to"
    value: ${{ steps.paths.outputs.log_file }}

runs:
  using: composite
  steps:
    - name: Resolve working paths
      id: paths
      shell: pwsh
      env:
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        $workdir = Join-Path $env:RUNNER_TEMP_DIR 'stub-config'
        New-Item -ItemType Directory -Force -Path $workdir | Out-Null
        "workdir=$workdir"                            >> $env:GITHUB_OUTPUT
        "log_file=$(Join-Path $workdir 'config.log')"  >> $env:GITHUB_OUTPUT
        "mode_file=$(Join-Path $workdir 'mode')"       >> $env:GITHUB_OUTPUT
        "pid_file=$(Join-Path $workdir 'config.pid')"  >> $env:GITHUB_OUTPUT

    - name: Setup go
      if: inputs.mode == 'start'
      uses: actions/setup-go@v6
      with:
        go-version: "1.25.0"
        cache: true

    # Started in oversized mode so a harness that forgets to set a mode
    # reproduces the scenario the fixture exists for rather than passing.
    - name: Launch endpoint (Unix)
      if: inputs.mode == 'start' && runner.os != 'Windows'
      shell: bash
      env:
        WORKDIR: ${{ steps.paths.outputs.workdir }}
        MODE_FILE: ${{ steps.paths.outputs.mode_file }}
        LOG_FILE: ${{ steps.paths.outputs.log_file }}
        PID_FILE: ${{ steps.paths.outputs.pid_file }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        ORG_ID: ${{ inputs.org_id }}
        OVERSIZED_BYTES: ${{ inputs.oversized_bytes }}
      run: |
        set -euo pipefail
        printf 'oversized' > "$MODE_FILE"
        rm -f "$LOG_FILE"
        # The fixture is behind the `integration` build tag; see its package doc.
        go build -tags integration -o "$WORKDIR/stubconfig" ./test/stubconfig
        # It binds a high loopback port and reads only files it owns, so it runs
        # unprivileged; the agent reaches it over loopback even though config
        # mode itself runs under sudo. It writes its own log (-log) rather than
        # having the shell redirect it, so both platforms capture output the
        # same way.
        nohup "$WORKDIR/stubconfig" \
          -listen "$HOST:$PORT" \
          -mode-file "$MODE_FILE" \
          -org-id "$ORG_ID" \
          -oversized-bytes "$OVERSIZED_BYTES" \
          -log "$LOG_FILE" > /dev/null 2>&1 &
        echo $! > "$PID_FILE"
        echo "Stub config endpoint started (pid $(cat "$PID_FILE"))"

    - name: Launch endpoint (Windows)
      if: inputs.mode == 'start' && runner.os == 'Windows'
      shell: pwsh
      env:
        WORKDIR: ${{ steps.paths.outputs.workdir }}
        MODE_FILE: ${{ steps.paths.outputs.mode_file }}
        LOG_FILE: ${{ steps.paths.outputs.log_file }}
        PID_FILE: ${{ steps.paths.outputs.pid_file }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        ORG_ID: ${{ inputs.org_id }}
        OVERSIZED_BYTES: ${{ inputs.oversized_bytes }}
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Content -Path $env:MODE_FILE -Value 'oversized' -NoNewline
        Remove-Item -Path $env:LOG_FILE -ErrorAction SilentlyContinue

        $exe = Join-Path $env:WORKDIR 'stubconfig.exe'
        # The fixture is behind the `integration` build tag; see its package doc.
        go build -tags integration -o $exe ./test/stubconfig
        if ($LASTEXITCODE -ne 0) { throw "failed to build stub config endpoint" }

        # Launched through WMI rather than Start-Process: a process started with
        # Start-Process -NoNewWindow shares this step's console and job object,
        # so the runner reaps it the moment the step ends - which surfaces later
        # as "the target machine actively refused it". Win32_Process.Create
        # parents it to WmiPrvSE instead, outside both. WMI offers no stream
        # redirection, which is why the fixture takes -log and writes its own.
        $arguments = @(
          "`"$exe`"",
          "-listen", "`"$($env:HOST):$($env:PORT)`"",
          "-mode-file", "`"$($env:MODE_FILE)`"",
          "-org-id", "`"$($env:ORG_ID)`"",
          "-oversized-bytes", $env:OVERSIZED_BYTES,
          "-log", "`"$($env:LOG_FILE)`""
        ) -join ' '
        $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create `
          -Arguments @{ CommandLine = $arguments }
        if ($created.ReturnValue -ne 0) {
          throw "Win32_Process.Create failed with return value $($created.ReturnValue)"
        }
        Set-Content -Path $env:PID_FILE -Value $created.ProcessId
        Write-Output "Stub config endpoint started (pid $($created.ProcessId))"

    # Proves the endpoint is actually listening before an agent is pointed at it.
    # Without this a reaped or unstarted fixture is indistinguishable from the
    # agent failing on the response, which is what the scenario measures.
    #
    # A TCP connect rather than an HTTP request, unlike the stub release
    # endpoint's probe: the fixture starts in oversized mode, so issuing a
    # request here would have the probe itself download the whole 1 GiB body.
    # Accepting the connection is all that has to be established.
    - name: Verify the endpoint is listening
      if: inputs.mode == 'start'
      shell: pwsh
      env:
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        LOG_FILE: ${{ steps.paths.outputs.log_file }}
        PID_FILE: ${{ steps.paths.outputs.pid_file }}
      run: |
        $lastError = 'no connection attempted'
        for ($i = 1; $i -le 15; $i++) {
          $client = New-Object System.Net.Sockets.TcpClient
          try {
            $connect = $client.BeginConnect($env:HOST, [int]$env:PORT, $null, $null)
            if ($connect.AsyncWaitHandle.WaitOne(5000) -and $client.Connected) {
              $client.EndConnect($connect)
              Write-Output "Stub config endpoint accepted a connection after $i attempt(s)"
              exit 0
            }
            $lastError = "connect timed out"
          } catch {
            $lastError = $_
          } finally {
            $client.Close()
          }
          Start-Sleep -Seconds 1
        }

        $alive = $false
        if (Test-Path $env:PID_FILE) {
          $stubPid = (Get-Content $env:PID_FILE).Trim()
          $alive = $null -ne (Get-Process -Id $stubPid -ErrorAction SilentlyContinue)
          Write-Output "Endpoint process $stubPid alive: $alive"
        }
        Write-Output "Endpoint log follows:"
        if (Test-Path $env:LOG_FILE) { Get-Content $env:LOG_FILE -ErrorAction SilentlyContinue }
        Write-Error "Stub config endpoint not listening (process alive: $alive): $lastError"
        exit 1

    - name: Set endpoint mode
      if: inputs.mode == 'ok' || inputs.mode == 'oversized'
      shell: pwsh
      env:
        MODE: ${{ inputs.mode }}
        MODE_FILE: ${{ steps.paths.outputs.mode_file }}
      run: |
        # Read per request, so the change applies to the very next config fetch
        # without restarting the endpoint.
        Set-Content -Path $env:MODE_FILE -Value $env:MODE -NoNewline
        Write-Output "Stub config endpoint mode set to $($env:MODE)"

    # The request log is the byte-count record: it shows how many bytes the
    # oversized response actually delivered before the agent hung up, which is
    # the measurement distinguishing a bounded read from the unbounded one.
    - name: Report endpoint request log
      if: inputs.mode == 'stop'
      shell: pwsh
      env:
        LOG_FILE: ${{ steps.paths.outputs.log_file }}
      run: |
        if (Test-Path $env:LOG_FILE) {
          Write-Output "---- $($env:LOG_FILE) ----"
          Get-Content $env:LOG_FILE -ErrorAction SilentlyContinue
        }

    - name: Tear down endpoint (Unix)
      if: inputs.mode == 'stop' && runner.os != 'Windows'
      shell: bash
      env:
        PID_FILE: ${{ steps.paths.outputs.pid_file }}
      run: |
        # Tolerates missing state so this can run from an always() cleanup even
        # when start never got far.
        if [ -f "$PID_FILE" ]; then
          kill "$(cat "$PID_FILE")" 2>/dev/null || true
          rm -f "$PID_FILE"
        fi
        echo "Stub config endpoint torn down"

    - name: Tear down endpoint (Windows)
      if: inputs.mode == 'stop' && runner.os == 'Windows'
      shell: pwsh
      env:
        PID_FILE: ${{ steps.paths.outputs.pid_file }}
      run: |
        if (Test-Path $env:PID_FILE) {
          $stubPid = Get-Content $env:PID_FILE
          Stop-Process -Id $stubPid -Force -ErrorAction SilentlyContinue
          Remove-Item $env:PID_FILE -ErrorAction SilentlyContinue
        }
        Write-Output "Stub config endpoint torn down"
