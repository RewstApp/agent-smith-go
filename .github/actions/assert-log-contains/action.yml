name: Assert log contains
description: >
  Assert that a log file contains every supplied pattern (substring match),
  polling until it does or timeout_seconds elapse - a fixed sleep before a
  single read was exactly long enough on the runner it was tuned on and too
  short on a slower one (sc-117884). Reading the agent's log file
  requires elevation now that its data directory is locked owner-only
  (sc-108849), so the shared implementation runs under sudo on Unix and
  natively on the already-elevated Windows runner.

inputs:
  log_file:
    description: "Path to the log file"
    required: true
  patterns:
    description: "Newline-separated list of required substrings"
    required: false
    default: ""
  scenario:
    description: >-
      Name of an entry in .github/workflows/e2e-commands.json whose
      `patterns` for this platform family are asserted instead of `patterns`
      (sc-126318).
    required: false
    default: ""
  timeout_seconds:
    description: "How long to keep polling for the patterns before failing. Success returns as soon as every pattern is present."
    required: false
    default: "60"
  interval_seconds:
    description: "Seconds between polls"
    required: false
    default: "2"
  subscribed_topic_qos:
    description: "When 'true', additionally require the matching line to include 'topic=' and 'qos=' tokens (used by the 'Subscribed to messages' check)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Assert log contains
      shell: pwsh
      env:
        LOG_FILE: ${{ inputs.log_file }}
        PATTERNS: ${{ inputs.patterns }}
        SCENARIO: ${{ inputs.scenario }}
        CATALOG: ${{ github.workspace }}/.github/workflows/e2e-commands.json
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
        SUBSCRIBED: ${{ inputs.subscribed_topic_qos }}
      run: |
        . "$env:GITHUB_WORKSPACE/.github/actions/_lib/Invoke-Elevated.ps1"
        Invoke-Elevated -Script "$env:GITHUB_ACTION_PATH/assert.ps1" -Arguments @{ LogFile = $env:LOG_FILE; Patterns = $env:PATTERNS; Scenario = $env:SCENARIO; Catalog = $env:CATALOG; TimeoutSeconds = ([int]$env:TIMEOUT_SECONDS); IntervalSeconds = ([int]$env:INTERVAL_SECONDS); SubscribedTopicQos = $env:SUBSCRIBED }
