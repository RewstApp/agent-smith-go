name: Wait for the service manager to respawn the agent
description: >-
  After a force-kill, wait until the agent the service manager brought back on
  its own has subscribed again - a new "Subscribed to messages" past the
  baseline. Only systemd does this (Restart=always), within about 100 ms of
  the SIGKILL and before the workflow's own restart step; launchd's KeepAlive
  has never landed inside this window and Windows has no auto-restart, so on
  those platforms there is nothing to wait for and the step says so. The
  platform knowledge lives here rather than as a condition on the calling
  step (sc-126318). See the sweep scenario's comment for the race this closes
  (sc-115785).

inputs:
  log_file:
    description: "Path to the agent log file"
    required: true
  baseline_count:
    description: "Count of 'Subscribed to messages' captured before the kill"
    required: true

runs:
  using: composite
  steps:
    - name: Wait for the respawned agent to subscribe (Linux)
      if: runner.os == 'Linux'
      uses: ./.github/actions/wait-for-log-line
      with:
        log_file: ${{ inputs.log_file }}
        pattern: Subscribed to messages
        max_attempts: "60"
        interval_seconds: "2"
        baseline_count: ${{ inputs.baseline_count }}

    - name: No automatic respawn on this platform
      if: runner.os != 'Linux'
      shell: bash
      run: echo "No service-manager respawn to wait for on $RUNNER_OS; the scenario restarts the agent itself."
