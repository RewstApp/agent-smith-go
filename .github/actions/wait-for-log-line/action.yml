name: Wait for log line
description: >
  Poll a log file until it contains the supplied pattern or the attempt
  budget is exhausted. Does not fail if the pattern never appears - asserting
  presence is the caller's job. Reading the agent's log file requires
  elevation now that its data directory is locked owner-only (sc-108849), so
  the shared implementation runs under sudo on Unix and natively on the
  already-elevated Windows runner.

inputs:
  log_file:
    description: "Path to the log file"
    required: true
  pattern:
    description: "Substring to wait for"
    required: true
  max_attempts:
    description: "Maximum number of poll attempts"
    required: false
    default: "60"
  interval_seconds:
    description: "Seconds between poll attempts"
    required: false
    default: "2"
  baseline_count:
    description: >-
      Occurrences of the pattern already in the log before whatever this is
      waiting on. When supplied, the wait is a delta - it returns only once the
      count exceeds this - and fails if that never happens. Required for any
      pattern the agent logs more than once ("Subscribed to messages" is written
      on every connect), where a bare match returns immediately against a stale
      line and the step waits for nothing. Omit for a pattern that appears once.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Wait for log line (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        LOG_FILE: ${{ inputs.log_file }}
        PATTERN: ${{ inputs.pattern }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        INTERVAL: ${{ inputs.interval_seconds }}
        BASELINE_COUNT: ${{ inputs.baseline_count }}
      run: |
        set -euo pipefail
        # Resolve pwsh up front: sudo resets PATH via secure_path on some runners.
        pwsh_path="$(command -v pwsh)"
        args=(-LogFile "$LOG_FILE" -Pattern "$PATTERN" -MaxAttempts "$MAX_ATTEMPTS" -IntervalSeconds "$INTERVAL")
        if [ -n "$BASELINE_COUNT" ]; then
          args+=(-BaselineCount "$BASELINE_COUNT")
        fi
        sudo "$pwsh_path" -NoProfile -File "$GITHUB_ACTION_PATH/wait.ps1" "${args[@]}"

    - name: Wait for log line (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        LOG_FILE: ${{ inputs.log_file }}
        PATTERN: ${{ inputs.pattern }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        INTERVAL: ${{ inputs.interval_seconds }}
        BASELINE_COUNT: ${{ inputs.baseline_count }}
      run: |
        $waitArgs = @{
          LogFile         = $env:LOG_FILE
          Pattern         = $env:PATTERN
          MaxAttempts     = [int]$env:MAX_ATTEMPTS
          IntervalSeconds = [int]$env:INTERVAL
        }
        if ($env:BASELINE_COUNT) { $waitArgs.BaselineCount = [int]$env:BASELINE_COUNT }
        & "$env:GITHUB_ACTION_PATH/wait.ps1" @waitArgs
