name: Assert scripts directory permissions
description: >
  Verify the command scripts directory has the permissions EnsureSecureDir
  enforces (sc-108848). On Linux/macOS, where the directory moved off shared
  system temp into the agent-owned data directory, asserts mode 0700 and
  ownership by the service account so an unprivileged local user cannot
  pre-plant or reuse it. On Windows, where the directory deliberately stays at
  its historical location (some customers have AV/EDR whitelisting scoped to
  it — see the README's "Hardening the Command Scripts Directory" section),
  only asserts it exists there; there are no POSIX mode/ownership bits to
  check. On Linux/macOS this now requires elevation (sc-108849): the scripts
  directory's parent, the org's data directory, is itself locked owner-only,
  so even a metadata-only stat of the scripts directory needs to traverse it.

inputs:
  scripts_dir:
    description: "Scripts directory to check"
    required: true
  expected_owner:
    description: "Expected owning account (Linux/macOS only; ignored on Windows)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Assert scripts directory permissions
      shell: pwsh
      env:
        SCRIPTS_DIR: ${{ inputs.scripts_dir }}
        EXPECTED_OWNER: ${{ inputs.expected_owner }}
      run: |
        . "$env:GITHUB_WORKSPACE/.github/actions/_lib/Invoke-Elevated.ps1"
        Invoke-Elevated -Script "$env:GITHUB_ACTION_PATH/fixture.ps1" -Arguments @{ ScriptsDir = $env:SCRIPTS_DIR; ExpectedOwner = $env:EXPECTED_OWNER }
