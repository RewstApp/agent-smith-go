name: Stop service
description: Stop the agent service via the appropriate platform service manager.

inputs:
  service:
    description: "Service name"
    required: true
  unload:
    description: >-
      macOS only: "true" boots the launchd daemon out (stop and unload) so a
      KeepAlive agent stays stopped until start-service loads it again; the
      default leaves it loaded and launchd respawns it. Ignored elsewhere.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Stop service (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo systemctl stop "${{ inputs.service }}"

    - name: Stop service (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SERVICE: ${{ inputs.service }}
      run: |
        # sc.exe stop returns once the SCM has accepted the request, while
        # the agent is still draining (it kills a running command first), so a
        # start right after it fails with 1056. Wait, bounded, for Stopped -
        # what systemctl stop already does on Linux and the bootout wait does
        # on macOS (sc-131253).
        sc.exe stop $env:SERVICE | Out-Host
        $deadline = (Get-Date).AddSeconds(240)
        while ((Get-Date) -lt $deadline) {
          $status = (Get-Service -Name $env:SERVICE -ErrorAction Stop).Status
          if ($status -eq 'Stopped') { exit 0 }
          Start-Sleep -Seconds 1
        }
        Write-Output "::error::$($env:SERVICE) was still $status 240 s after the stop request"
        exit 1

    - name: Stop service (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        UNLOAD: ${{ inputs.unload }}
      run: |
        # The agent's daemon is KeepAlive (SuccessfulExit=false), so a bare
        # `launchctl stop` is answered by launchd respawning it within
        # seconds. That is what most scenarios want: the agent's own update
        # and uninstall paths open the loaded service (stop-service then
        # run-agent --update is the lifecycle job's sequence). A scenario that
        # must change what the agent reads at startup between stop and start
        # (sc-126322's clock step seeds the journal and the clock offset) asks
        # for unload=true, which boots the daemon out so it stays stopped until
        # start-service bootstraps it again.
        if [ "$UNLOAD" = "true" ]; then
          sudo launchctl bootout "system/${{ inputs.service }}" || true
          # bootout returns while launchd is still stopping the daemon (the
          # agent drains its workers first), and a bootstrap issued in that
          # window fails, leaving nothing to start (sc-131253: a start 60 ms
          # after the stop exited 3). Wait, bounded, until it is unloaded.
          # Only print's "Could not find service" (exit 113) means unloaded;
          # any other failure (sudo, launchd) is not taken as one.
          rc=0
          for _ in $(seq 1 60); do
            rc=0
            sudo launchctl print "system/${{ inputs.service }}" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 113 ]; then exit 0; fi
            sleep 1
          done
          echo "::error::${{ inputs.service }} was not unloaded 60 s after bootout (last launchctl print exit $rc)"
          exit 1
        else
          sudo launchctl stop "system/${{ inputs.service }}" || true
        fi
