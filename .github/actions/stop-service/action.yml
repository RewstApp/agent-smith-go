name: Stop service
description: Stop the agent service via the appropriate platform service manager.

inputs:
  service:
    description: "Service name"
    required: true

runs:
  using: composite
  steps:
    - name: Stop service (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo systemctl stop "${{ inputs.service }}"

    - name: Stop service (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        sc.exe stop "${{ inputs.service }}"

    - name: Stop service (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # bootout, not `launchctl stop`: the agent's daemon is KeepAlive
        # (SuccessfulExit=false), so a bare stop is answered by launchd
        # respawning it within seconds, and a scenario that stops the agent
        # to change what it reads at startup (sc-126322's clock step seeds
        # the journal and the clock offset between stop and start) raced
        # the respawn and lost on macOS alone. bootout unloads the daemon,
        # which stops it and keeps it stopped until start-service loads it
        # again - the same stop+unload the agent's own Stop() performs.
        sudo launchctl bootout "system/${{ inputs.service }}" || true
