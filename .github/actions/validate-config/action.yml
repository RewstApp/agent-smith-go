name: Validate config
description: >
  Assert config.json contains the required fields and rewst_org_id matches the
  expected value. Also exposes device_id as an output. Reading config.json
  requires elevation now that it is written owner-only (sc-108849), so the
  shared implementation runs under sudo on Unix and natively on the
  already-elevated Windows runner.

inputs:
  config_dir:
    description: "Directory containing the per-org agent config (without org id suffix)"
    required: true
  org_id:
    description: "Expected rewst_org_id"
    required: true

outputs:
  device_id:
    description: "device_id read from config.json"
    value: ${{ steps.run.outputs.device_id }}
  azure_iot_hub_host:
    description: "azure_iot_hub_host read from config.json (the MQTT broker host)"
    value: ${{ steps.run.outputs.azure_iot_hub_host }}

runs:
  using: composite
  steps:
    - id: run
      name: Parse and validate config.json
      shell: pwsh
      env:
        CONFIG_DIR: ${{ inputs.config_dir }}
        ORG_ID: ${{ inputs.org_id }}
      run: |
        . "$env:GITHUB_WORKSPACE/.github/actions/_lib/Invoke-Elevated.ps1"
        Invoke-Elevated -Script "$env:GITHUB_ACTION_PATH/validate.ps1" -Arguments @{ ConfigDir = $env:CONFIG_DIR; OrgId = $env:ORG_ID }
