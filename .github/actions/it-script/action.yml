name: Run an e2e helper script
description: >-
  Run one of the PowerShell helpers under .github/workflows/it-scripts as the
  privileged user on every platform. The scripts read their inputs from the
  environment the calling step sets and write step outputs through
  GITHUB_OUTPUT, so the caller is one platform-neutral step. The agent's log,
  config and scripts directories are root-owned on Linux and macOS, hence sudo
  there; the environment is forwarded whole through Invoke-Elevated.ps1 (every
  variable as a NAME=VALUE argument to env(1), since Ubuntu 26.04's sudo-rs
  ignores -E, sc-129246) rather than through a per-step allow-list that
  drifted between twins (sc-126318). Invoke-Elevated.ps1 is where the helper
  steps branch on the platform; every helper runs in its own `pwsh -File`
  process there, so a step's exit code means the same thing everywhere.

inputs:
  script:
    description: "Helper name under .github/workflows/it-scripts, without the .ps1 suffix"
    required: true

# The helpers write their results to GITHUB_OUTPUT under these names; a
# composite action must list what it exposes, so the union of every helper's
# outputs is declared here. A helper that does not write a name leaves it empty.
outputs:
  subscribed:
    description: "Step output `subscribed` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.subscribed }}
  completed:
    description: "Step output `completed` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.completed }}
  truncated:
    description: "Step output `truncated` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.truncated }}
  timed_out:
    description: "Step output `timed_out` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.timed_out }}
  path:
    description: "Step output `path` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.path }}
  swept:
    description: "Step output `swept` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.swept }}
  retrying:
    description: "Step output `retrying` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.retrying }}
  succeeded:
    description: "Step output `succeeded` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.succeeded }}
  stopped:
    description: "Step output `stopped` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.stopped }}
  started:
    description: "Step output `started` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.started }}
  scripts_dir:
    description: "Step output `scripts_dir` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.scripts_dir }}
  saved:
    description: "Step output `saved` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.saved }}
  renewed:
    description: "Step output `renewed` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.renewed }}
  lost:
    description: "Step output `lost` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.lost }}
  backoffs:
    description: "Step output `backoffs` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.backoffs }}
  attempt:
    description: "Step output `attempt` written by the helper, when it writes one"
    value: ${{ steps.run.outputs.attempt }}

runs:
  using: composite
  steps:
    - name: Run helper (elevated)
      id: run
      shell: pwsh
      env:
        IT_SCRIPT: ${{ inputs.script }}
      run: |
        . "$env:GITHUB_WORKSPACE/.github/actions/_lib/Invoke-Elevated.ps1"
        Invoke-Elevated -Script "$env:GITHUB_WORKSPACE/.github/workflows/it-scripts/$env:IT_SCRIPT.ps1"
