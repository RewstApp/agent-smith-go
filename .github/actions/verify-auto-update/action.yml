name: Verify auto update completed
description: >
  Assert the agent's log shows the auto updater ran and that the agent is no
  longer running the integration-test version (v0.0.0-it). Reading the
  agent's log file requires elevation now that its data directory is locked
  owner-only (sc-108849), so the shared implementation runs under sudo on
  Unix and natively on the already-elevated Windows runner.

inputs:
  log_file:
    description: "Path to the agent log file"
    required: true
  wait_seconds:
    description: "Seconds to sleep before reading the log"
    required: false
    default: "15"
  it_version:
    description: "Version token expected to be absent from the last 'Agent Smith started' line"
    required: false
    default: "version=v0.0.0-it"

runs:
  using: composite
  steps:
    - name: Verify auto update completed
      shell: pwsh
      env:
        LOG_FILE: ${{ inputs.log_file }}
        WAIT_SECONDS: ${{ inputs.wait_seconds }}
        IT_VERSION: ${{ inputs.it_version }}
      run: |
        . "$env:GITHUB_WORKSPACE/.github/actions/_lib/Invoke-Elevated.ps1"
        Invoke-Elevated -Script "$env:GITHUB_ACTION_PATH/verify.ps1" -Arguments @{ LogFile = $env:LOG_FILE; WaitSeconds = ([int]$env:WAIT_SECONDS); ItVersion = $env:IT_VERSION }
