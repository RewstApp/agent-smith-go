name: Start service
description: >
  Start the agent service via the appropriate platform service manager. The
  counterpart to stop-service, for scenarios that stop the agent mid-run and need
  it back (e.g. verifying a stop is honored while the broker is wedged, then
  resuming the same cycle-by-cycle recovery).

inputs:
  service:
    description: "Service name"
    required: true

runs:
  using: composite
  steps:
    - name: Start service (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo systemctl start "${{ inputs.service }}"

    - name: Start service (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        sc.exe start "${{ inputs.service }}"

    - name: Start service (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Load the daemon first in case stop-service booted it out (see that
        # action): bootstrap is a no-op failure when it is already loaded,
        # which is the state after kill-service, so the error is ignored.
        sudo launchctl bootstrap system "/Library/LaunchDaemons/${{ inputs.service }}.plist" 2>/dev/null || true
        # Confirm it is loaded before starting it: a bootstrap racing the end
        # of a bootout fails silently, and `start` on an unloaded label exits
        # 3. Retry the bootstrap, bounded, until launchd knows the daemon.
        for _ in $(seq 1 30); do
          sudo launchctl print "system/${{ inputs.service }}" >/dev/null 2>&1 && break
          sleep 1
          sudo launchctl bootstrap system "/Library/LaunchDaemons/${{ inputs.service }}.plist" 2>/dev/null || true
        done
        # Bare label, not a "system/<label>" service target: launchctl's `start`
        # is a legacy subcommand that resolves a label in the current domain, so
        # the target form is taken as a literal label and exits 3 (ESRCH). This
        # mirrors what the agent's own darwinService.Start does.
        sudo launchctl start "${{ inputs.service }}"
