name: Assert config secret absent
description: >
  Assert the service password was not persisted to config.json on disk. No-op
  when no secret is supplied. Reading config.json requires elevation now that
  it is written owner-only (sc-108849), so the shared implementation runs
  under sudo on Unix and natively on the already-elevated Windows runner.

inputs:
  config_dir:
    description: "Directory containing the per-org agent config (without org id suffix)"
    required: true
  org_id:
    description: "Org id used as the config subdirectory"
    required: true
  secret:
    description: "Secret value that must not appear in config.json (e.g. the service password)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Assert secret absent from config.json
      shell: pwsh
      env:
        CONFIG_DIR: ${{ inputs.config_dir }}
        ORG_ID: ${{ inputs.org_id }}
        SECRET: ${{ inputs.secret }}
      run: |
        . "$env:GITHUB_WORKSPACE/.github/actions/_lib/Invoke-Elevated.ps1"
        Invoke-Elevated -Script "$env:GITHUB_ACTION_PATH/assert.ps1" -Arguments @{ ConfigDir = $env:CONFIG_DIR; OrgId = $env:ORG_ID }
