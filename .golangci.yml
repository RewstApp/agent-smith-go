version: "2"
run:
  # The integration-test fixtures (test/stubbroker, test/stubconfig,
  # test/wedgedservice) are excluded from `go test ./...` by the integration
  # tag, and the Go e2e scenarios (test/e2e, which install a real service) by
  # the e2e tag, so neither can count uncovered statements against the coverage
  # threshold; listing the tags here keeps them linted.
  build-tags:
    - integration
    - e2e
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
