version: "2"
run:
  # The integration-test fixtures (test/stubbroker, test/stubrelease,
  # test/stubconfig, test/wedgedservice) are excluded from
  # `go test ./...` by this tag so they cannot count uncovered statements
  # against the coverage threshold; listing it here keeps them linted.
  build-tags:
    - integration
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
